<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barmetrix File Pulls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d2026;--muted:#646b76;--line:#e2e0da;--accent:#1f5f8b;
  --red:#c8372d;--red-bg:#fbe4e1;--blue:#1e6fc2;--blue-bg:#e1eefb;--amber:#a35f00;--amber-bg:#fdecd2;
  --yellow-bg:#fff7c9;--green:#2c7a45;--green-bg:#e2f3e7;--grey-bg:#eceae5;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171b;--panel:#1d2026;--ink:#e8e6e1;--muted:#9aa1ab;--line:#30343c;--accent:#6fb0e0;
  --red:#ff7b70;--red-bg:#4a1f1c;--blue:#7fb6f0;--blue-bg:#18324d;--amber:#f2b25c;--amber-bg:#46310f;
  --yellow-bg:#3d3713;--green:#79cf95;--green-bg:#183a24;--grey-bg:#2a2d33;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.01em}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--grey-bg);color:var(--ink);font-weight:500}
.who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}
main{padding:16px max(16px,env(safe-area-inset-left)) 60px;max-width:1500px;margin:0 auto}
button.b{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--red);border-color:var(--red)}
button.warn{background:var(--amber);border-color:var(--amber);color:#fff}
button.big{padding:12px 22px;font-size:15px}
button:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:80px}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:8px;border-left:4px solid}
.banner b{display:block;margin-bottom:2px}
.banner.red{background:var(--red-bg);border-color:var(--red)}
.banner.blue{background:var(--blue-bg);border-color:var(--blue)}
.banner.amber{background:var(--amber-bg);border-color:var(--amber)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--panel);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover td{filter:brightness(.97)}
tr.r-red td{background:var(--red-bg)} tr.r-blue td{background:var(--blue-bg)}
tr.r-amber td{background:var(--amber-bg)} tr.r-yellow td{background:var(--yellow-bg)}
td.mono,.mono{font-family:var(--mono);font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--grey-bg);color:var(--muted)}
.tag.green{background:var(--green-bg);color:var(--green)} .tag.red{background:var(--red-bg);color:var(--red)}
.tag.blue{background:var(--blue-bg);color:var(--blue)} .tag.amber{background:var(--amber-bg);color:var(--amber)}
.muted{color:var(--muted)} .small{font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--panel);width:min(680px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer .hd{padding:18px 22px 0}
.drawer .hd h2{margin:0 0 4px;font-size:20px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:14px;padding:0 22px}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:500}
.body{padding:18px 22px;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ft .grow{flex:1}
.msg{padding:10px 12px;border-radius:7px;margin-bottom:12px}
.msg.err{background:var(--red-bg);color:var(--red)} .msg.ok{background:var(--green-bg);color:var(--green)}
.msg.info{background:var(--blue-bg)}
.diff{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.diff div{padding:2px 0}
.diff del{color:var(--red)} .diff ins{color:var(--green);text-decoration:none}
.actions{display:flex;flex-direction:column;gap:10px}
.actions .row{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px}
.actions .row p{margin:0;flex:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:30;max-width:90vw}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.day{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;min-width:0}
.day .dn{font-weight:600}
.day.today{border-color:var(--accent)}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff}
.day.on .muted{color:#fff;opacity:.85}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard b{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:900px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const C = window.BARMETRIX_CONFIG || {};
const sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey);
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const SOURCES = [["toast","Toast"],["spoton","SpotOn"],["mstarpos","MStar"],["square","Square"],["silverware","Silverware (not automated)"],["none","None — Fintech only"]];
const AUTOMATED = new Set(["toast","spoton","mstarpos","square"]);
const POS_PREFIX = {toast:"Toast",spoton:"SpotOn",mstarpos:"MstarPOS",square:"Square",silverware:"Silverware"};
const CYCLES = [["weekly","Weekly"],["biweekly","Every 2 weeks"],["4-week","Every 4 weeks"],["custom","Custom"],["on_hold","On hold"]];
const STATUSES = [["active","Active"],["paused","Paused"],["onboarding","Onboarding"]];
const DAYS = ["","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const FINTECH_NONE = new Set(["","no","none","no fintech"]);
const EDIT_FIELDS = ["client_display_name","source_system","login_reference","client_pos_id","audit_cycle","audit_day_of_week","custom_cycle_days","last_pulled_date","next_due_date","status","notes","fintech_login_reference","fintech_client_pos_id","fintech_retailer_name"];
const editFields = () => S.hasMapCols ? EDIT_FIELDS.concat(["map_enabled","map_machine","map_machine_picked","pilot_name"]) : EDIT_FIELDS;
const LABEL = {map_enabled:"Map this client",map_machine:"Mapping machine",map_machine_picked:"Machine chosen by a person",pilot_name:"Name in Pilot",client_display_name:"Client name",source_system:"POS",login_reference:"POS login (1Password item)",client_pos_id:"POS venue name / ID",audit_cycle:"Audit cycle",audit_day_of_week:"Audit day",custom_cycle_days:"Custom cycle days",last_pulled_date:"Last audit date",next_due_date:"Next audit date",status:"Client status",notes:"Notes",fintech_login_reference:"Fintech login (1Password item)",fintech_client_pos_id:"Fintech venue name",fintech_retailer_name:"Fintech retailer name"};

let S = {user:null, view:"clients", clients:[], queue:[], pulls:[], machines:[], jobs:[], hasDelayCols:true, hasMapCols:true, hasWinCol:true, timer:null, edit:null};

/* ---------- dates ---------- */
const todayISO = () => { const d = new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const addDays = (iso,n) => { const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fmtDate = iso => { if(!iso) return "—"; const d = new Date(String(iso).slice(0,10)+"T12:00:00"); return d.toLocaleDateString("en-US",{weekday:"short",month:"2-digit",day:"2-digit",year:"numeric"}); };
const fmtLong = iso => { if(!iso) return "—"; const d = new Date(String(iso).slice(0,10)+"T12:00:00"); return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}); };
const fmtTime = ts => ts ? new Date(ts).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "—";
const cycleDays = (c,custom) => ({weekly:7,biweekly:14,"4-week":28}[c] || (c==="custom" ? parseInt(custom)||0 : 0));

/* ---------- client state ---------- */
const hasFintech = c => !FINTECH_NONE.has(String(c.fintech_login_reference||"").trim().replace(/^"+|"+$/g,"").toLowerCase());
const isFailed = c => (c.last_pull_status||"").toLowerCase()==="failed" || (c.fintech_last_pull_status||"").toLowerCase()==="failed";
const isDelayed = c => c.toast_data_delay==="delayed" && (c.last_pull_status||"")==="failed";
function rowClass(c){
  if (isDelayed(c)) return "r-blue";
  if (isFailed(c)) return "r-red";
  if ((c.status||"").toLowerCase()==="paused") return "r-amber";
  if ((c.status||"").toLowerCase()==="active" && c.next_due_date && c.next_due_date < todayISO()) return "r-yellow";
  return "";
}
function statusTag(v){
  const s = (v||"").toLowerCase();
  if (!s) return '<span class="tag">—</span>';
  const cls = s==="succeeded"?"green":s==="failed"?"red":s==="pending"?"amber":"";
  const txt = {succeeded:"Succeeded",failed:"Failed",pending:"Pending",never_attempted:"Never run"}[s] || s;
  return `<span class="tag ${cls}">${esc(txt)}</span>`;
}

/* ---------- data ---------- */
const CLIENT_COLS = "id,client_display_name,source_system,login_reference,client_pos_id,audit_cycle,audit_day_of_week,custom_cycle_days,last_pulled_date,next_due_date,status,notes,last_pull_status,fintech_last_pull_status,fintech_login_reference,fintech_client_pos_id,fintech_retailer_name,deleted_at,updated_at";
const DELAY_COLS = ",toast_data_delay,toast_data_delay_last_update,toast_data_delay_checked_at,delay_reviewed_at";

const MAP_COLS = ",map_enabled,map_machine,map_machine_picked,pilot_name";
async function loadClients(){
  let q = await sb.from("clients").select(CLIENT_COLS + (S.hasDelayCols?DELAY_COLS:"") + (S.hasMapCols?MAP_COLS:"") + (S.hasWinCol?",recipe_delete_after_months":"")).is("deleted_at",null).order("client_display_name");
  if (q.error && S.hasWinCol && /recipe_delete/i.test(q.error.message)) { S.hasWinCol = false; return loadClients(); }
  if (q.error && S.hasMapCols && /map_|pilot_name/i.test(q.error.message)) { S.hasMapCols = false; return loadClients(); }
  if (q.error && S.hasDelayCols && /column/i.test(q.error.message)) { S.hasDelayCols = false; return loadClients(); }
  if (q.error) throw q.error;
  S.clients = q.data;
  if (S.hasMapCols){
    const m = await sb.from("machines").select("*").order("name");
    S.machines = m.error ? [] : m.data;
    const j = await sb.from("map_jobs").select("*").gte("requested_at", addDays(todayISO(),-10)+"T00:00:00").order("requested_at",{ascending:false}).limit(500);
    S.jobs = j.error ? [] : j.data;
  }
}
/* ---------- mapping machines ---------- */
const MACHINE_FRESH = 15*60e3;
const normName = s => String(s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
const holdersOf = c => !c.pilot_name ? [] : S.machines.filter(m=>(m.clients_held||[]).some(h=>normName(h.name)===normName(c.pilot_name)));
const ago = ts => { if (!ts) return "never"; const m = Math.round((Date.now()-new Date(ts))/6e4); return m<1?"just now":m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} days ago`; };
function mapState(c){
  if (!S.hasMapCols) return null;
  if (!c.map_enabled) return {cls:"", txt:"Not set to map"};
  const hs = holdersOf(c);
  if (!c.pilot_name) return {cls:"red", txt:"No machine holds this client in Pilot"};
  if (!c.map_machine) return hs.length>1 ? {cls:"red", txt:`Pick a machine (${hs.length} hold it)`} : {cls:"red", txt:"No audit machine holds it"};
  const m = S.machines.find(x=>x.name===c.map_machine);
  if (!m || !hs.some(x=>x.name===c.map_machine)) return {cls:"red", txt:`${c.map_machine} no longer holds it`};
  if (Date.now()-new Date(m.last_checkin) > MACHINE_FRESH) return {cls:"amber", txt:`${m.name} · offline (seen ${ago(m.last_checkin)})`};
  return {cls:"green", txt:`Maps on ${m.name}`};
}
const PASS = {premap:"3:00 am pre-map", audit:"5:00 am map + import", final:"Final map + import", manual:"Map now"};
function jobLine(j){
  const st = {queued:'<span class="tag amber">Waiting</span>', running:'<span class="tag blue">Running</span>', done:'<span class="tag green">Done</span>',
    failed:'<span class="tag red">Failed</span>', held:'<span class="tag red">Held</span>', cancelled:'<span class="tag">Cancelled</span>'}[j.status]||esc(j.status);
  const imp = {waiting_click:'<span class="tag amber">Import ready — waiting for a click</span>', released:'<span class="tag blue">Import released</span>',
    imported:'<span class="tag green">Imported</span>', held:'<span class="tag red">Import held</span>', failed:'<span class="tag red">Import failed</span>'}[j.import_status]||"";
  return `${esc(PASS[j.pass]||j.pass)} ${st} ${imp}`;
}
async function mapNow(c, day, btn){
  if (!c.map_machine){ toast("Choose a mapping machine for this client first (Clients tab → client → Mapping)."); return; }
  if (btn) btn.disabled = true;
  const r = await sb.from("map_jobs").insert({client_id:c.id, machine:c.map_machine, pass:"manual", requested_by:S.user.email, audit_date:day||null}).select("id");
  if (r.error){ toast("Not queued: "+r.error.message); if (btn) btn.disabled=false; return; }
  toast(`Queued on ${c.map_machine}. It starts within a few minutes.`); await refresh(true);
}
async function releaseImport(j, btn){
  if (btn) btn.disabled = true;
  const r = await sb.from("map_jobs").update({import_status:"released", import_released_by:S.user.email, import_released_at:new Date().toISOString()}).eq("id",j.id).eq("import_status","waiting_click").select("id");
  if (r.error || !r.data?.length){ toast("Not released: "+(r.error?.message||"it was already released")); if (btn) btn.disabled=false; return; }
  toast("Released — the robot imports as soon as it can."); await refresh(true);
}
function openMachines(){
  const ov = document.createElement("div"); ov.className="overlay";
  const draw = ()=>{ ov.innerHTML = `<div class="drawer" role="dialog" aria-modal="true">
    <div class="hd"><h2>Mapping machines</h2><div class="muted small">Every computer running the mapping robot checks in every 5 minutes and reports which clients its Pilot holds.</div></div>
    <div class="body">${S.machines.length?S.machines.map(m=>{ const fresh = Date.now()-new Date(m.last_checkin) < MACHINE_FRESH;
      return `<div class="actions" style="margin-bottom:14px"><div class="row" style="flex-direction:column;gap:8px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%"><b style="font-size:16px">${esc(m.name)}</b>
          <span class="tag ${fresh?"green":"red"}">${fresh?"Online":"Offline"} · ${esc(ago(m.last_checkin))}</span>
          <span class="tag">${m.pilot_running?"Pilot open":"Pilot closed"}</span><span class="grow"></span>
          <select data-mk="${esc(m.name)}" style="max-width:190px"><option value="audit" ${m.kind==="audit"?"selected":""}>Audit machine</option><option value="desk" ${m.kind==="desk"?"selected":""}>Desk machine (never maps)</option></select></div>
        <div class="small">${(m.clients_held||[]).map(h=>{ const c = S.clients.find(x=>normName(x.pilot_name)===normName(h.name));
          return `<div>${esc(h.name)}${c?` → <b>${esc(c.client_display_name)}</b>`:' <span class="tag red">not linked to a client</span>'} <span class="muted">· last sync ${h.last_sync?esc(fmtTime(h.last_sync)):"—"}</span></div>`; }).join("") || '<span class="muted">Holds no clients.</span>'}</div>
      </div></div>`; }).join("") : `<p class="muted">No machine has checked in yet.</p>`}
      <p class="hint">A client's Pilot name is linked automatically when it matches the client's name. If one shows "not linked", open that client on the Clients tab → Mapping and type its Pilot name.</p></div>
    <div class="ft"><span class="grow"></span><button class="b big" id="mc">Close</button></div></div>`;
    ov.querySelector("#mc").onclick = ()=>ov.remove();
    ov.querySelectorAll("[data-mk]").forEach(s=>s.onchange=async()=>{ const r = await sb.from("machines").update({kind:s.value}).eq("name",s.dataset.mk).select("name");
      if (r.error||!r.data?.length){ toast("Not saved: "+(r.error?.message||"no row")); return; } S.machines.find(x=>x.name===s.dataset.mk).kind = s.value; toast("Saved."); });
  };
  draw(); document.body.appendChild(ov);
  ov.addEventListener("mousedown", e=>{ if(e.target===ov) ov.remove(); });
}
async function loadQueue(){
  const since = new Date(Date.now()-3*864e5).toISOString();
  const q = await sb.from("run_requests").select("*").gte("requested_at",since).order("requested_at",{ascending:false}).limit(60);
  if (q.error) throw q.error;
  S.queue = q.data;
}
async function loadPulls(){
  const since = addDays(todayISO(), -21);
  const q = await sb.from("data_pulls").select("id,client_id,run_date,report_type,status,trigger_type,pull_start_date,pull_end_date,error_message,file_paths,started_at,completed_at").gte("run_date",since).order("started_at",{ascending:false}).limit(400);
  if (q.error) throw q.error;
  S.pulls = q.data;
}
async function refresh(quiet){
  try { await Promise.all([loadClients(), loadQueue(), loadMapping().catch(()=>{}), loadDb().catch(()=>{})]); if (S.view==="history") await loadPulls(); render(); }
  catch(e){ if(!quiet) toast("Could not load: "+(e.message||e)); }
}
function startTimer(){ clearInterval(S.timer); S.timer = setInterval(()=>{ if(!S.edit && !M.other && !M.flag && !(S.view==="mapping" && M.search) && !(S.view==="dbreview" && D.client) && document.visibilityState==="visible") refresh(true); }, 60000); }

/* ---------- auth ---------- */
async function boot(){
  if (!C.supabaseUrl || !C.supabaseAnonKey) { $("#app").innerHTML = `<div class="center"><h2>Not configured</h2><p class="muted">config.js is missing the Supabase address or public key.</p></div>`; return; }
  const { data } = await sb.auth.getSession();
  sb.auth.onAuthStateChange((_e, session)=>{ setUser(session?.user||null); });
  setUser(data.session?.user||null);
}
async function setUser(u){
  if (u && !/@barmetrix\.com$/i.test(u.email||"")) { await sb.auth.signOut(); S.user=null; signInScreen("That account isn't a barmetrix.com account. Sign in with your work Google account."); return; }
  const was = S.user; S.user = u;
  if (!u) { signInScreen(); return; }
  if (!was) { await refresh(); startTimer(); }
}
function signInScreen(err){
  $("#app").innerHTML = `<div class="center"><h1 style="margin:0">Barmetrix File Pulls</h1>
    <p class="muted" style="max-width:420px">Sign in with your barmetrix.com Google account.</p>
    ${err?`<div class="msg err">${esc(err)}</div>`:""}
    <button class="b primary big" id="g">Sign in with Google</button></div>`;
  $("#g").onclick = () => sb.auth.signInWithOAuth({provider:"google", options:{redirectTo: (location.origin + location.pathname).replace(/\/$/, ""), queryParams:{hd:"barmetrix.com", prompt:"select_account"}}});
}

/* ---------- render ---------- */
function render(){
  if (!S.user) return;
  const v = S.view;
  $("#app").innerHTML = `<header><h1>Barmetrix File Pulls</h1>

    <div class="who"><span>${esc(S.user.email)}</span><button class="b" id="out">Sign out</button></div></header>
    <main id="main"></main>`;
  document.querySelectorAll("nav button").forEach(b=>b.onclick=async()=>{ S.view=b.dataset.v; if(S.view==="history") await loadPulls().catch(e=>toast(e.message)); if(S.view==="mapping") await loadMapping().catch(e=>toast(e.message)); if(S.view==="dbreview") await loadDb().catch(e=>toast(e.message)); render(); });

/* ---------- database review: dead recipes first (more checks join later) ----------
   Pilot rebuilds every report from TODAY's recipes, so deleting a recipe changes any old audit
   that is run again. A recipe is only offered here once its last sale is older than the client's
   "safe to delete after" window (clients.recipe_delete_after_months). */
const D = {ready:true, sum:[], client:null, items:[], tab:"open", sel:new Set(), q:""};
const DB_WINDOWS = [3,6,9,12,18,24];
const DB_KEEP_MONTHS = 3;   // "Keep" is a snooze, not forever (Dave 11/11/2026); tools/db_review.py KEEP_MONTHS
const keepUntil = ts => { const d = new Date(ts); d.setMonth(d.getMonth()+DB_KEEP_MONTHS); return d.toISOString().slice(0,10); };
const DB_COLS = "id,client_id,venue,kind,recipe,last_sold,units_ever,buttons_mapped,last_counted,suggestion,reason,status,choice,decided_by,decided_at,applied_at,applied_detail,found_at";
const DB_TABS = [["open","Waiting for a decision"],["decided","Approved — the robot deletes next"],["applied","Deleted"],["kept","Kept"]];
const dbOpenTotal = () => D.sum.filter(r=>r.status==="open").reduce((a,r)=>a+r.n,0);
const dbTabOf = r => r.status==="open" ? "open" : r.status==="applied" ? "applied" : (r.choice==="keep"||r.choice==="reject") ? "kept" : r.status==="decided" ? "decided" : r.status==="failed" ? "decided" : null;

async function loadDb(){
  const q = await sb.from("db_review_summary").select("*");
  if (q.error){ D.ready = !/relation|does not exist|schema cache|column/i.test(q.error.message); if (!D.ready) return; throw q.error; }
  D.ready = true; D.sum = q.data;
  const r = await sb.from("db_review_runs").select("*").order("requested_at",{ascending:false}).limit(1);
  D.run = r.error ? null : (r.data[0] || null);
  if (D.client) await loadDbItems();
}
function runLine(){
  const r = D.run;
  if (!r) return `<span class="muted small">Not run from here yet.</span>`;
  const who = esc((r.requested_by||"").split("@")[0]);
  if (r.status==="queued") return `<span class="tag amber">Waiting for the robot's computer</span> <span class="muted small">asked by ${who} ${esc(ago(r.requested_at))}. It starts within a minute when that computer is on.</span>`;
  if (r.status==="running") return `<span class="tag blue">Running on ${esc(r.machine||"")}</span> <span class="muted small">started ${esc(ago(r.started_at))}</span>`;
  if (r.status==="failed") return `<span class="tag red">Last run failed</span> <span class="muted small">${esc(fmtTime(r.finished_at))} · ${esc(r.summary||"")}</span>`;
  return `<span class="tag green">Last run ${esc(fmtTime(r.finished_at))}</span> <span class="muted small">${esc(r.summary||"")}</span>`;
}
async function runDbReview(btn){
  btn.disabled = true;
  const r = await sb.from("db_review_runs").insert({requested_by:S.user.email}).select("id");
  if (r.error){ toast("Not started: "+r.error.message); btn.disabled = false; return; }
  toast("Asked the robot to run the database review. The list refreshes when it finishes.");
  await loadDb().catch(()=>{}); renderDb();
  const t0 = Date.now();
  const tick = setInterval(async()=>{                     // follow it until it finishes (max 15 min)
    await loadDb().catch(()=>{});
    if (S.view==="dbreview" && !D.client) renderDb();
    if (!D.run || ["done","failed"].includes(D.run.status) || Date.now()-t0 > 15*60e3) clearInterval(tick);
  }, 15000);
}
async function loadDbItems(){
  const c = D.client, out = [];
  for (let from=0; ; from+=1000){
    let q = sb.from("db_review_items").select(DB_COLS).eq("kind","dead");
    q = c.cid ? q.eq("client_id",c.cid) : q.eq("venue",c.venue).is("client_id",null);
    const r = await q.order("last_sold",{ascending:true,nullsFirst:true}).order("recipe").range(from, from+999);
    if (r.error) throw r.error;
    out.push(...r.data);
    if (r.data.length < 1000) break;
  }
  D.items = out.filter(r=>r.status!=="gone");
  const live = new Set(D.items.map(r=>r.id));
  [...D.sel].forEach(id=>{ if (!live.has(id)) D.sel.delete(id); });
}
function dbCards(){
  const cards = new Map();
  D.sum.filter(r=>r.kind==="dead" && r.status!=="gone").forEach(r=>{
    const k = ckey(r.client_id, r.venue);
    if (!cards.has(k)) cards.set(k, {cid:r.client_id, venue:r.venue, open:0, decided:0, applied:0, last:r.last_found});
    const x = cards.get(k);
    if (r.status==="open") x.open+=r.n; else if (r.status==="applied") x.applied+=r.n; else if (r.status==="decided") x.decided+=r.n;
    if (r.last_found > x.last) x.last = r.last_found;
  });
  return [...cards.values()].map(x=>{ const c = x.cid && clientOf(x.cid); return Object.assign(x, {client:c, name: c ? c.client_display_name : x.venue}); })
    .sort((a,b)=> b.open-a.open || a.name.localeCompare(b.name));
}
const windowOf = c => (c && c.recipe_delete_after_months) || 12;
function windowSelect(c){
  if (!c) return `<span class="muted small">12 months (link this Pilot name to a client to change it)</span>`;
  return `<select data-win="${esc(c.id)}" style="max-width:150px">${DB_WINDOWS.map(m=>`<option value="${m}" ${windowOf(c)===m?"selected":""}>${m} months</option>`).join("")}</select>`;
}
async function saveWindow(sel){
  const m = parseInt(sel.value), c = S.clients.find(x=>x.id===sel.dataset.win);
  const r = await sb.from("clients").update({recipe_delete_after_months:m}).eq("id",c.id).select("id");
  if (r.error||!r.data?.length){ toast("Not saved: "+(r.error?.message||"no row")); sel.value = windowOf(c); return; }
  c.recipe_delete_after_months = m;
  toast(`Saved: ${c.client_display_name} — ${m} months. The list updates on the robot's next scan.`);
}

function renderDb(){
  if (!D.ready){ $("#main").innerHTML = `<div class="msg info"><b>The Database Review isn't switched on in the database yet.</b> Run "STEP 7 - SUPABASE - database review" (Google Drive → My Drive → Barmetrix Automation) in the Supabase SQL Editor, then reload this page.</div>`; return; }

}
function renderDbClient(){

async function decideDb(list, choice){
  if (!list.length) return;
  const now = new Date().toISOString(), ids = list.map(r=>r.id);
  let done = 0;
  for (let i=0; i<ids.length; i+=100){
    const r = await sb.from("db_review_items").update({status:"decided", choice, decided_by:S.user.email, decided_at:now, updated_at:now})
      .in("id", ids.slice(i,i+100)).eq("status","open").select("id");
    if (r.error){ toast("Stopped: "+r.error.message); break; }
    done += r.data.length;
  }
  ids.forEach(id=>D.sel.delete(id));
  toast(choice==="approve" ? `${done} approved — the robot deletes them on its next run.` : `${done} kept for ${DB_KEEP_MONTHS} months — they come back if they still haven't sold.`);
  await loadDbItems().catch(()=>{}); await loadDb().catch(()=>{}); render();
}

/* ---------- mapping review: organised by AUDIT DAY, then CLIENT ---------- */
const mondayOf = iso => { const d = new Date(iso+"T12:00:00"); return addDays(iso, -((d.getDay()+6)%7)); };
const daysBetween = (a,b) => Math.round((new Date(a+"T12:00:00")-new Date(b+"T12:00:00"))/864e5);
const fmtDay = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"});
const M = {ready:true, hasOpts:true, sum:[], weekStart:mondayOf(todayISO()), day:todayISO(), client:null, items:[], audits:[], tab:"open", q:"", search:"", other:null, flag:null};
const KIND = {mapped:"Mapped", trashed:"Trashed", decide:"Mapping to check", stuck:"No suggestion yet", trash:"Trash suggestion",
  fix:"Recipe / size fix", invoice:"Invoice line", unmapped:"Waiting for the count"};
const KIND_ORDER = ["stuck","decide","trash","fix","invoice","unmapped"];
const KIND_HEAD = {stuck:"The robot couldn't settle these", decide:"Suggestions to approve", trash:"Trash suggestions",
  fix:"Recipe and size fixes", invoice:"Invoice lines", unmapped:"Not rung in yet — waiting for the count"};
const kindTag = k => `<span class="tag ${k==="trash"||k==="trashed"?"":k==="fix"?"blue":k==="stuck"?"red":"amber"}">${esc(KIND[k]||k)}</span>`;
const pct = c => c==null||c==="" ? "—" : Math.round(Number(c)*100)+"%";
const ITEM_COLS = "id,venue,client_id,audit_date,kind,title,suggestion,reason,target,size_type,delta_oz,bottle_ml,confidence,status,choice,other_text,decided_by,decided_at,decided_note,applied_at,applied_detail,created_at";
const ckey = (cid,venue) => cid ? "c:"+cid : "v:"+venue;
const clientOf = cid => S.clients.find(c=>c.id===cid);
const isWaiting = r => r.status==="decided" || (r.flagged && (r.status==="robot"||r.status==="applied"));
const openTotal = () => M.sum.filter(r=>r.status==="open").reduce((a,r)=>a+r.n,0);

async function loadMapping(){
  const end = addDays(M.weekStart,6);
  const qs = await Promise.all([
    sb.from("mapping_summary").select("*").gte("audit_date",M.weekStart).lte("audit_date",end),
    sb.from("mapping_summary").select("*").in("status",["open","decided","failed"]),
    sb.from("mapping_summary").select("*").is("audit_date",null)]);
  const bad = qs.find(q=>q.error);
  if (bad){ M.ready = !/relation|does not exist|schema cache|column/i.test(bad.error.message); if (!M.ready) return; throw bad.error; }
  M.ready = true;
  const seen = new Map();
  qs.forEach(q=>q.data.forEach(r=>seen.set([r.client_id,r.venue,r.audit_date,r.status,r.flagged].join("|"), r)));
  M.sum = [...seen.values()];
  if (M.client) await loadClientItems();
}
async function loadClientItems(){
  const c = M.client, out = [];
  for (let from=0; ; from+=1000){
    // options/chosen arrive with STEP 9; until then the tab works without the choice buttons
    let q = sb.from("mapping_items").select(ITEM_COLS + (M.hasOpts ? ",options,chosen" : ""));
    q = c.cid ? q.eq("client_id",c.cid) : q.eq("venue",c.venue).is("client_id",null);
    if (c.audit!=="all") q = c.audit ? q.eq("audit_date",c.audit) : q.is("audit_date",null);
    const r = await q.order("kind").order("title").range(from, from+999);
    if (r.error && M.hasOpts && /options|chosen/i.test(r.error.message)){ M.hasOpts = false; return loadClientItems(); }
    if (r.error) throw r.error;
    out.push(...r.data);
    if (r.data.length < 1000) break;
  }
  M.items = out;
  const a = c.cid ? await sb.from("mapping_summary").select("audit_date").eq("client_id",c.cid)
                  : await sb.from("mapping_summary").select("audit_date").eq("venue",c.venue);
  M.audits = [...new Set((a.data||[]).map(r=>r.audit_date).filter(Boolean))].sort().reverse();
}

/* which clients have an audit on a given day: the schedule (cycle from the next / last audit date) */
function scheduledOn(c, day){
  if (!["active","onboarding"].includes((c.status||"").toLowerCase())) return false;
  if (c.last_pulled_date===day || c.next_due_date===day) return true;
  const cyc = cycleDays(c.audit_cycle, c.custom_cycle_days);
  if (!cyc) return false;
  const anchor = c.last_pulled_date && day < c.last_pulled_date ? c.last_pulled_date : c.next_due_date;
  if (!anchor) return false;
  const diff = daysBetween(day, anchor);
  return diff % cyc === 0 && Math.abs(diff) <= cyc*12;
}
function tally(rows){
  const t = {open:0, waiting:0, robot:0, done:0, failed:0};
  rows.forEach(r=>{ if (r.status==="open") t.open+=r.n; else if (r.status==="failed") t.failed+=r.n;
    else if (isWaiting(r)) t.waiting+=r.n; else if (r.status==="robot") t.robot+=r.n; else if (r.status==="applied") t.done+=r.n; });
  return t;
}
function dayCards(day){
  const cards = new Map();
  S.clients.filter(c=>scheduledOn(c,day)).forEach(c=>cards.set(ckey(c.id), {cid:c.id, venue:c.client_display_name, rows:[]}));
  M.sum.filter(r=>r.audit_date===day).forEach(r=>{
    const k = ckey(r.client_id, r.venue);
    if (!cards.has(k)) cards.set(k, {cid:r.client_id, venue:r.venue, rows:[]});
    cards.get(k).rows.push(r);
  });
  return [...cards.values()].map(x=>{ const c = x.cid && clientOf(x.cid);
      return Object.assign(x, {name: c ? c.client_display_name : x.venue, client:c, t:tally(x.rows)}); })
    .sort((a,b)=> (b.t.open+b.t.failed)-(a.t.open+a.t.failed) || a.name.localeCompare(b.name));
}

    <div id="mboard">

        <span class="dn">${esc(fmtDay(d))}${d===today?" · today":""}</span>

        ${t.open?`<span class="tag amber">${t.open} need a person</span>`:""}${t.failed?`<span class="tag red">${t.failed} failed</span>`:""}</button>`; }).join("")}</div>
    ${earlier.size?`<div class="banner amber"><b>Still open from earlier audits</b>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${[...earlier.values()].map(e=>{ const t = tally(e.rows), c = e.cid && clientOf(e.cid);
        return `<button class="b" data-ec="${esc(e.cid||"")}" data-ev="${esc(e.venue)}" data-ea="${esc(e.audit||"")}">${esc(c?c.client_display_name:e.venue)} · ${e.audit?esc(fmtDay(e.audit)):"no date"} · ${t.open+t.failed+t.waiting} open</button>`; }).join("")}</div></div>`:""}
    <h2 style="margin:18px 0 10px;font-size:18px">${esc(fmtLong(M.day))} <span class="muted small" style="font-weight:400">${cards.length} audit${cards.length===1?"":"s"}</span></h2>
    <div class="ccards">${cards.map(x=>{
      const t = x.t, any = t.open+t.waiting+t.robot+t.done+t.failed;
      const cyc = x.client ? (CYCLES.find(c=>c[0]===x.client.audit_cycle)||[,""])[1] : "";
      const ms = x.client && mapState(x.client);
      const jobs = x.cid ? S.jobs.filter(j=>j.client_id===x.cid && (j.audit_date===M.day || (!j.audit_date && (j.requested_at||"").slice(0,10)===M.day))) : [];
      const waitJob = jobs.find(j=>j.import_status==="waiting_click");
      return `<div class="ccard" role="button" tabindex="0" data-cc="${esc(x.cid||"")}" data-cv="${esc(x.venue)}">
        <b>${esc(x.name)}</b>
        <span class="small muted">${x.client?esc([POS_PREFIX[x.client.source_system]||"", cyc].filter(Boolean).join(" · ")):'<span class="tag red">Not linked to a client</span>'}</span>
        ${ms?`<span class="small"><span class="tag ${ms.cls}">${esc(ms.txt)}</span></span>`:""}
        ${jobs.length?`<span class="small" style="display:flex;flex-direction:column;gap:3px">${jobs.slice(0,4).reverse().map(j=>`<span>${jobLine(j)}</span>`).join("")}</span>`:""}
        ${x.client && (x.client.map_enabled || waitJob)?`<span class="chips">${waitJob?`<button class="b primary" data-imp="${esc(waitJob.id)}">Import now</button>`:""}${x.client.map_machine?`<button class="b" data-mapnow="${esc(x.cid)}">Map now</button>`:""}</span>`:""}
        <span class="chips">
          ${t.open?`<span class="tag amber">${t.open} need a person</span>`:""}
          ${t.failed?`<span class="tag red">${t.failed} failed</span>`:""}
          ${t.waiting?`<span class="tag blue">${t.waiting} waiting for the robot</span>`:""}
          ${t.robot?`<span class="tag green">${t.robot} mapped by the robot</span>`:""}
          ${t.done?`<span class="tag">${t.done} done</span>`:""}
          ${any||jobs.length?"":`<span class="muted small">${M.day>today?"Audit not done yet":"No mapping run yet"}</span>`}
        </span></div>`; }).join("") || `<div class="muted">No audits on this day.</div>`}</div>
    </div><div id="mresults"></div>`;
  $("#wkp").onclick = ()=>moveWeek(-7); $("#wkn").onclick = ()=>moveWeek(7);
  $("#wkt").onclick = ()=>{ M.weekStart = mondayOf(todayISO()); M.day = todayISO(); reloadBoard(); };
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ M.day=b.dataset.day; renderMapping(); });
  document.querySelectorAll("[data-cc]").forEach(b=>{ const go = ()=>openClient(b.dataset.cc||null, b.dataset.cv, M.day);
    b.onclick = go; b.onkeydown = e=>{ if (e.target===b && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); go(); } }; });
  document.querySelectorAll("[data-mapnow]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); mapNow(clientOf(b.dataset.mapnow), M.day, b); });
  document.querySelectorAll("[data-imp]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); releaseImport(S.jobs.find(j=>j.id===b.dataset.imp), b); });
  $("#mmach")?.addEventListener("click", openMachines);
  document.querySelectorAll("[data-ec]").forEach(b=>b.onclick=()=>openClient(b.dataset.ec||null, b.dataset.ev, b.dataset.ea||null));
  let tm; $("#msearch").oninput = e=>{ M.search=e.target.value; clearTimeout(tm); tm=setTimeout(searchAll,350); };
  if (M.search) searchAll();
}
function moveWeek(n){ M.weekStart = addDays(M.weekStart,n); M.day = addDays(M.day,n); reloadBoard(); }
async function reloadBoard(){ try{ await loadMapping(); }catch(e){ toast(e.message); } render(); }
async function openClient(cid, venue, audit){
  M.client = {cid, venue, audit}; M.other = null; M.q = "";
  try{ await loadClientItems(); }catch(e){ toast(e.message); }
  M.tab = M.items.some(i=>i.status==="open") ? "open" : M.items.some(i=>i.status==="failed") ? "robot" : M.items.some(i=>i.status==="decided"||i.choice==="wrong") ? "waiting" : "robot";
  render(); window.scrollTo(0,0);
}

async function searchAll(){
  const box = $("#mresults"), board = $("#mboard"); if (!box) return;
  const t = M.search.trim();
  if (!t){ box.innerHTML = ""; board.hidden = false; return; }
  board.hidden = true; box.innerHTML = `<div class="muted">Searching…</div>`;
  const s = t.replace(/[%,()]/g," ");
  const r = await sb.from("mapping_items").select(ITEM_COLS).or(`title.ilike.%${s}%,suggestion.ilike.%${s}%,venue.ilike.%${s}%,other_text.ilike.%${s}%`).order("audit_date",{ascending:false}).limit(300);
  if (r.error){ box.innerHTML = `<div class="msg err">${esc(r.error.message)}</div>`; return; }
  box.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Client</th><th>Audit</th><th>POS button</th><th>Type</th><th>Suggestion / what was done</th><th>Status</th></tr></thead><tbody>
    ${r.data.map(i=>{ const c = i.client_id && clientOf(i.client_id);
      return `<tr data-sc="${esc(i.client_id||"")}" data-sv="${esc(i.venue)}" data-sa="${esc(i.audit_date||"")}"><td>${esc(c?c.client_display_name:i.venue)}</td><td class="mono small">${i.audit_date?fmtDate(i.audit_date):"—"}</td>
      <td><b>${esc(i.title)}</b></td><td>${kindTag(i.kind)}</td><td class="small" style="white-space:normal;max-width:340px">${esc(i.suggestion||"")}</td><td>${statusWord(i)}</td></tr>`; }).join("") || '<tr><td colspan="6" class="muted">Nothing found.</td></tr>'}
    </tbody></table></div><p class="muted small">Click a row to open that client's audit.</p>`;
  box.querySelectorAll("[data-sc]").forEach(tr=>tr.onclick=()=>{ M.search=""; openClient(tr.dataset.sc||null, tr.dataset.sv, tr.dataset.sa||null); });
}
function statusWord(i){
  if (i.choice==="wrong") return `<span class="tag red">Flagged wrong</span>`;
  return {open:'<span class="tag amber">Needs a person</span>', decided:'<span class="tag blue">Waiting for the robot</span>',
    robot:'<span class="tag green">Mapped by the robot</span>', applied:'<span class="tag">Done</span>', failed:'<span class="tag red">Failed</span>'}[i.status] || esc(i.status);
}

/* ---------- one client, one audit ---------- */
function renderClientAudit(){
  const c = M.client, cl = c.cid && clientOf(c.cid), name = cl ? cl.client_display_name : c.venue;
  const it = M.items;
  const open = it.filter(i=>i.status==="open");
  const waiting = it.filter(i=>i.status==="decided" || (i.choice==="wrong" && i.status!=="open"));
  const robot = it.filter(i=>(i.status==="robot"||i.status==="failed") && i.choice!=="wrong");
  const done = it.filter(i=>i.status==="applied" && i.choice!=="wrong");
  const audits = [...new Set([...(c.audit && c.audit!=="all"?[c.audit]:[]), ...M.audits])].sort().reverse();
  const tabs = [["open","Needs a person",open.length],["waiting","Waiting for the robot",waiting.length],["robot","Mapped by the robot",robot.length],["done","Done",done.length]];
  $("#main").innerHTML = `
    <div class="bar"><button class="b" id="mback">‹ ${esc(fmtLong(M.day))}</button></div>
    <div class="bar" style="align-items:baseline">
      <h2 style="margin:0;font-size:22px">${esc(name)}</h2>
      ${cl?"":'<span class="tag red">Not linked to a client</span>'}
      <span class="grow"></span>
      <label style="margin:0">Audit</label>
      <select id="maudit" style="max-width:300px">${audits.map(a=>`<option value="${a}" ${a===c.audit?"selected":""}>${esc(fmtLong(a))}</option>`).join("")}
        ${c.audit===null?'<option value="" selected>No audit date</option>':""}<option value="all" ${c.audit==="all"?"selected":""}>All audits</option></select>
    </div>
    ${cl?"":`<div class="msg info">These items came from a Pilot venue name that doesn't match a client in the Clients tab. They still work; Claude links them on the next run.</div>`}
    ${writeNowBar(cl, c, it)}
    <div class="tabs" style="padding:0;margin:0 0 14px">${tabs.map(([k,l,n])=>`<button data-mt="${k}" class="${M.tab===k?"on":""}">${l} (${n})</button>`).join("")}</div>
    <div id="mbody"></div>`;
  $("#mback").onclick = ()=>{ M.client=null; M.items=[]; render(); };
  $("#mwrite")?.addEventListener("click", ()=>{ M.confirmWrite=true; renderClientAudit(); });
  $("#mwrite-no")?.addEventListener("click", ()=>{ M.confirmWrite=false; renderClientAudit(); });
  $("#mwrite-yes")?.addEventListener("click", e=>writeNow(cl, c, e.currentTarget));
  $("#maudit").onchange = async e=>{ M.client.audit = e.target.value===""?null:e.target.value; try{ await loadClientItems(); }catch(er){ toast(er.message); } renderClientAudit(); };
  document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{ M.tab=b.dataset.mt; M.other=null; renderClientAudit(); });
  if (M.tab==="open") mapOpen(open);
  else if (M.tab==="waiting") mapTable(waiting, "Nothing waiting. Decisions show here until the robot's next run carries them out.");
  else if (M.tab==="robot") mapTable(robot, "The robot hasn't mapped anything on its own for this audit.", true);
  else mapTable(done, "Nothing finished yet for this audit.");
}

/* "Write to Pilot now": approved items are written into Pilot by the client's mapping computer
   within a minute, instead of waiting for a run (Dave 11/12: waiting "leaves the audit incomplete"). */
function writeJob(cl, audit){
  return S.jobs.find(j=>cl && j.client_id===cl.id && j.pass==="manual" && (j.detail||{}).kind==="apply"
    && j.audit_date===audit && ["queued","running"].includes(j.status));
}
function writeNowBar(cl, c, it){
  if (!cl || !c.audit || c.audit==="all") return "";
  const n = it.filter(i=>i.status==="decided" && i.choice!=="reject").length;
  const job = writeJob(cl, c.audit);
  const last = S.jobs.filter(j=>j.client_id===cl.id && (j.detail||{}).kind==="apply" && j.audit_date===c.audit && ["done","failed"].includes(j.status))
    .sort((a,b)=>String(b.finished_at).localeCompare(String(a.finished_at)))[0];
  if (job) return `<div class="banner blue"><b>Writing to Pilot on ${esc(job.machine||"")}…</b>${job.status==="queued"?"Waiting for that computer to pick it up (under a minute when it's on).":"Running now. Pilot on that computer is in use until it finishes."}</div>`;
  const lastLine = last ? `<span class="muted small">Last write: ${esc(fmtTime(last.finished_at))} — ${esc(last.summary||last.status)}</span>` : "";
  if (!n) return lastLine ? `<div class="bar">${lastLine}</div>` : "";
  if (M.confirmWrite) return `<div class="banner amber"><b>Write ${n} approved item${n>1?"s":""} into Pilot now?</b>
      Pilot on ${esc(cl.map_machine||"the mapping computer")} will close and reopen while it works (about a minute, plus 15 seconds per item). Make sure nobody is in the middle of something in Pilot on that computer.
      <div style="margin-top:8px;display:flex;gap:8px"><button class="b primary" id="mwrite-yes">Yes, write them now</button><button class="b" id="mwrite-no">Not now</button></div></div>`;
  return `<div class="bar"><button class="b primary" id="mwrite">Write ${n} approved item${n>1?"s":""} to Pilot now</button>${lastLine}</div>`;
}
async function writeNow(cl, c, btn){
  if (!cl.map_machine){ toast("This client has no mapping computer yet (Clients tab → client → Mapping)."); return; }
  btn.disabled = true;
  const r = await sb.from("map_jobs").insert({client_id:cl.id, machine:cl.map_machine, pass:"manual", requested_by:S.user.email,
    audit_date:c.audit, detail:{kind:"apply"}}).select("id");
  if (r.error){ toast("Not started: "+r.error.message); btn.disabled=false; return; }
  M.confirmWrite = false;
  toast(`Sent to ${cl.map_machine}. The tab updates as items are written.`);
  await refresh(true);
  const t0 = Date.now();
  const tick = setInterval(async()=>{ await refresh(true); if (M.client) { await loadClientItems().catch(()=>{}); renderClientAudit(); }
    if (!writeJob(cl, c.audit) || Date.now()-t0 > 30*60e3) clearInterval(tick); }, 15000);
}

function mapOpen(items){
  const byKind = {}; items.forEach(i=>(byKind[i.kind] ||= []).push(i));
  const kinds = [...KIND_ORDER.filter(k=>byKind[k]), ...Object.keys(byKind).filter(k=>!KIND_ORDER.includes(k))];
  $("#mbody").innerHTML = items.length ? `<p class="muted small" style="margin-top:0">Pick the right button. When you're done, press "Write approved items to Pilot now" above. "None of these" leaves it unmapped and stops it being suggested again.</p>
    ${kinds.map(k=>`<h3 style="margin:18px 0 8px;font-size:15px">${esc(KIND_HEAD[k]||KIND[k]||k)} <span class="muted small">${byKind[k].length}</span></h3>
      <div class="actions">${byKind[k].map(cardHTML).join("")}</div>`).join("")}`
    : `<div class="center" style="min-height:30vh"><b>Nothing needs a person for this audit.</b><span class="muted">New items appear here after each mapping run.</span></div>`;
  wireCards();
}
function cardHTML(i){
  const other = M.other===i.id;
  const opts = Array.isArray(i.options) ? i.options : [];
  if (opts.length) return `<div class="row" data-id="${esc(i.id)}" style="flex-direction:column;gap:10px">
    <p><b>${esc(i.title)}</b><br><span class="muted small" style="white-space:normal">${esc(i.reason||"")}</span></p>
    <div style="display:flex;flex-direction:column;gap:8px;align-items:stretch">
      ${opts.map((o,k)=>`<button class="b ${k===0?"primary":""}" style="text-align:left" data-opt="${k}">${esc(o.label)}</button>`).join("")}
    </div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <button class="b" data-a="reject">None of these — leave it unmapped</button>
      <a href="#" class="small" data-a="other" style="color:var(--muted)">Something different? Write it in</a></div>
    ${other?`<div><label>What should it be?</label><textarea id="ot" placeholder="e.g. Map to Tito's Vodka, 1.5 oz"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="b primary" data-a="other-save">Save</button><button class="b" data-a="other-cancel">Cancel</button></div></div>`:""}
  </div>`;
  return `<div class="row" data-id="${esc(i.id)}" style="flex-wrap:wrap">
    <p style="min-width:260px"><b>${esc(i.title)}</b><br>
      <span>${esc(i.suggestion||"")}</span>${i.confidence!=null?` <span class="muted small">· ${pct(i.confidence)} sure</span>`:""}<br>
      <span class="muted small" style="white-space:normal">${esc(i.reason||"")}</span></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start">
      ${i.kind==="unmapped"?`<button class="b" data-a="noted">Noted</button><button class="b" data-a="other">Something else</button>`
        :i.kind==="stuck"?`<button class="b primary" data-a="other">Tell it what this is</button><button class="b" data-a="reject">Leave it unmapped</button>`
        :i.kind==="trash"?`<button class="b primary" data-a="approve">Trash it</button><button class="b" data-a="reject">Don't trash</button><button class="b" data-a="other">Something else</button>`
        :`<button class="b primary" data-a="approve">Approve</button><button class="b" data-a="reject">Reject</button><button class="b" data-a="other">Something else</button>`}</div>
    ${other?`<div style="flex-basis:100%"><label>What should it be?</label><textarea id="ot" placeholder="e.g. Map to Tito's Vodka, 1.5 oz pour — or: trash it"></textarea>
      <div style="margin-top:8px;display:flex;gap:8px"><button class="b primary" data-a="other-save">Save</button><button class="b" data-a="other-cancel">Cancel</button></div></div>`:""}
  </div>`;
}
function wireCards(){
  document.querySelectorAll("#mbody .row[data-id]").forEach(row=>{
    const id = row.dataset.id;
    row.querySelectorAll("[data-opt]").forEach(b=>b.onclick=async()=>{
      const it = M.items.find(x=>x.id===id), o = (it.options||[])[+b.dataset.opt];
      const now = new Date().toISOString();
      const patch = {status:"decided", choice:"approve", chosen:o, suggestion:o.label, target:o.target||null,
        target_type:o.type||null, delta_oz:o.pour_oz??null, decided_by:S.user.email, decided_at:now, updated_at:now};
      row.querySelectorAll("button").forEach(x=>x.disabled=true);
      const r = await sb.from("mapping_items").update(patch).eq("id",id).eq("status","open").select("id");
      if (r.error){ toast("Not saved: "+r.error.message); row.querySelectorAll("button").forEach(x=>x.disabled=false); return; }
      if (!r.data?.length) toast("Someone already decided this one.");
      else toast(`Chosen: ${o.label}. Press "Write approved items to Pilot now" when you're ready.`);
      Object.assign(it, patch); loadMapping().catch(()=>{}).then(render);
    });
    row.querySelectorAll("[data-a]").forEach(b=>b.onclick=async(e)=>{
      e.preventDefault();
      const a = b.dataset.a;
      if (a==="other"){ M.other=id; renderClientAudit(); $("#ot")?.focus(); return; }
      if (a==="other-cancel"){ M.other=null; renderClientAudit(); return; }
      const now = new Date().toISOString();
      let patch = {status:"decided", choice:a, decided_by:S.user.email, decided_at:now, updated_at:now};
      if (a==="other-save"){ const t = ($("#ot").value||"").trim(); if (!t){ toast("Write what it should be first."); return; } patch.choice="other"; patch.other_text=t; }
      b.disabled = true;
      const r = await sb.from("mapping_items").update(patch).eq("id",id).eq("status","open").select("id");
      if (r.error){ toast("Not saved: "+r.error.message); b.disabled=false; return; }
      if (!r.data?.length) toast("Someone already decided this one.");
      else toast({approve:`Approved. Press "Write approved items to Pilot now" when you're ready.`,reject:"Left unmapped — it won't be suggested again.",noted:"Noted.","other-save":"Saved. A written answer needs Claude to read it before it can go into Pilot."}[a]);
      M.other=null; const it = M.items.find(x=>x.id===id); if (it) Object.assign(it, patch);
      loadMapping().catch(()=>{}).then(render);
    });
  });
}

function mapTable(list, empty, canFlag){
  $("#mbody").innerHTML = `<div class="bar"><input id="mq" placeholder="Search button or product" value="${esc(M.q)}" style="max-width:280px"><span class="grow"></span><span class="muted small" id="mcount"></span></div>
    <div class="tablewrap"><table><thead><tr><th>POS button</th><th>Type</th><th>What was done</th><th>Sure</th><th>Who / when</th><th>Why</th><th></th></tr></thead><tbody id="mrows"></tbody></table></div>`;
  const draw = ()=>{
    const t = M.q.toLowerCase();
    const rows = list.filter(i=>!t || (i.title+" "+(i.suggestion||"")+" "+(i.target||"")).toLowerCase().includes(t));
    $("#mcount").textContent = `${rows.length} item${rows.length===1?"":"s"}`;
    $("#mrows").innerHTML = rows.map(i=>{
      const who = i.decided_by ? i.decided_by.split("@")[0] : i.decided_note || (i.status==="robot"||i.status==="failed" ? "robot" : "");
      const what = i.choice==="wrong" ? `Flagged wrong → ${esc(i.other_text||"")}` : i.choice==="other" ? `Changed → ${esc(i.other_text||"")}` :
        i.choice==="reject" ? "Rejected" : i.choice==="noted" ? "Noted" : esc(i.suggestion||i.applied_detail||"");
      return `<tr style="cursor:default"><td><b>${esc(i.title)}</b></td><td>${kindTag(i.kind)}</td>
        <td style="white-space:normal;max-width:340px">${i.status==="failed"?'<span class="tag red">Failed</span> ':""}${what}${i.applied_detail&&i.choice?`<div class="muted small">${esc(i.applied_detail)}</div>`:""}</td>
        <td>${pct(i.confidence)}</td><td class="small">${esc(who)}<div class="muted mono">${fmtTime(i.decided_at||i.applied_at||i.created_at)}</div></td>
        <td class="small" style="white-space:normal;max-width:320px">${esc(i.reason||"")}</td>
        <td>${canFlag && i.status==="robot" && i.choice!=="wrong"?`<button class="b" data-w="${esc(i.id)}">Wrong — fix it</button>`:""}</td></tr>`; }).join("") ||
      `<tr><td colspan="7" class="muted">${esc(empty)}</td></tr>`;
    document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>flagWrong(list.find(i=>i.id===b.dataset.w)));
  };
  draw();
  $("#mq").oninput = e=>{ M.q=e.target.value; draw(); };
}
function flagWrong(i){
  M.flag = i.id;
  const ov = document.createElement("div"); ov.className="overlay";
  ov.innerHTML = `<div class="drawer" role="dialog" aria-modal="true">
    <div class="hd"><h2>Wrong mapping</h2><div class="muted small">${esc(i.venue)}${i.audit_date?" · audit "+esc(fmtLong(i.audit_date)):""}</div></div>
    <div class="body"><div id="wm"></div><p><b>${esc(i.title)}</b><br>The robot did: ${esc(i.suggestion||"")}</p>
      <label>What should it be?</label><textarea id="wt" placeholder="e.g. Should be Don Julio Reposado, not Blanco — or: should be trashed"></textarea>
      <p class="hint">The robot removes the wrong mapping and puts the right one in on its next run. Your correction is also kept so it doesn't make the same mistake again.</p></div>
    <div class="ft"><button class="b big" id="wc">Cancel</button><span class="grow"></span><button class="b primary big" id="ws">Send the fix</button></div></div>`;
  document.body.appendChild(ov);
  const close = ()=>{ ov.remove(); M.flag=null; };
  ov.addEventListener("mousedown", e=>{ if(e.target===ov) close(); });
  $("#wc").onclick = close; $("#wt").focus();
  $("#ws").onclick = async()=>{
    const t = ($("#wt").value||"").trim();
    if (!t){ $("#wm").innerHTML = `<div class="msg err">Write what it should be first.</div>`; return; }
    $("#ws").disabled = true;
    const now = new Date().toISOString();
    const r = await sb.from("mapping_items").update({choice:"wrong", other_text:t, decided_by:S.user.email, decided_at:now, updated_at:now}).eq("id",i.id).select("id");
    if (r.error || !r.data?.length){ $("#ws").disabled=false; $("#wm").innerHTML = `<div class="msg err">Not saved: ${esc(r.error?.message||"no row updated")}</div>`; return; }
    close(); toast("Sent — the robot fixes it on its next run."); await loadMapping().catch(()=>{}); render();
  };
}

function renderClients(){
  const cs = S.clients;
  const failed = cs.filter(c=>isFailed(c) && !isDelayed(c));

    ${paused.length?`<div class="banner amber"><b>Paused clients (${paused.length})</b>${paused.map(c=>esc(c.client_display_name)).join(", ")}</div>`:""}
    ${active.length?`<div class="banner blue"><b>In the queue (${active.length})</b>${active.map(r=>`${esc(reqLabel(r.request_type))}${r.client_id?" — "+esc(name(r.client_id)):""} <span class="muted">(${r.status==="running"?"running":"waiting"})</span>`).join(" · ")}</div>`:""}
    <div class="bar"><input id="q" placeholder="Search clients" style="max-width:260px"><span class="grow"></span>
      <button class="b" id="tom">Pull All Files for Tomorrow</button>
      <button class="b" id="raf">Run All Failed</button>
      <button class="b primary" id="add">Add client</button></div>
    <div class="tablewrap"><table><thead><tr><th>Client</th><th>POS</th><th>Cycle</th><th>Last audit</th><th>Next audit</th><th>Sales</th><th>Fintech</th><th>Toast data</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody></table></div>
    <p class="small muted">Refreshes every 60 seconds. Updated ${new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}.</p>`;
  const draw = () => {
    const t = ($("#q").value||"").toLowerCase();
    $("#rows").innerHTML = cs.filter(c=>!t || (c.client_display_name||"").toLowerCase().includes(t)).map(c=>`

        <td>${esc((CYCLES.find(s=>s[0]===c.audit_cycle)||[0,c.audit_cycle||"—"])[1])}</td>
        <td class="mono">${fmtDate(c.last_pulled_date)}</td>
        <td class="mono">${fmtDate(c.next_due_date)}</td>
        <td>${AUTOMATED.has(c.source_system)?statusTag(c.last_pull_status):'<span class="tag">—</span>'}</td>
        <td>${hasFintech(c)?statusTag(c.fintech_last_pull_status):'<span class="tag">—</span>'}</td>
        <td>${c.source_system!=="toast"||!c.toast_data_delay?'<span class="muted">—</span>':c.toast_data_delay==="delayed"?`<span class="tag blue">Delay · ${esc(c.toast_data_delay_last_update||"?")}</span>`:c.toast_data_delay==="realtime"?'<span class="tag green">Current</span>':'<span class="tag">Unknown</span>'}</td>
        <td>${esc((STATUSES.find(s=>s[0]===(c.status||"").toLowerCase())||[0,c.status])[1])}</td></tr>`).join("");

/* ---------- editor ---------- */
function blankClient(){ return {client_display_name:"",source_system:"toast",login_reference:"",client_pos_id:"",audit_cycle:"weekly",audit_day_of_week:null,custom_cycle_days:null,last_pulled_date:null,next_due_date:null,status:"active",notes:"",fintech_login_reference:null,fintech_client_pos_id:null,fintech_retailer_name:null}; }

function openEditor(c){
  S.edit = {orig:c, draft:Object.assign(blankClient(), c ? JSON.parse(JSON.stringify(c)) : {}), tab:"schedule", msg:null, review:null};
  S.edit.draft.map_choice = S.edit.draft.map_machine_picked && S.edit.draft.map_machine ? S.edit.draft.map_machine : "auto";
  if (S.edit.draft.fintech_login_reference && FINTECH_NONE.has(String(S.edit.draft.fintech_login_reference).toLowerCase())) S.edit.draft.fintech_login_reference = "";

}
function closeEditor(){ S.edit=null; document.querySelector(".overlay")?.remove(); }

function field(k, type="text", opts){
  const v = S.edit.draft[k];
  if (type==="select") return `<select data-k="${k}">${opts.map(([val,l])=>`<option value="${esc(val)}" ${String(v??"")===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  if (type==="textarea") return `<textarea data-k="${k}">${esc(v)}</textarea>`;
  return `<input data-k="${k}" type="${type}" value="${esc(v??"")}">`;
}

      <div class="full"><label>${LABEL.fintech_client_pos_id}</label>${field("fintech_client_pos_id")}<div class="hint">The company name Fintech shows when choosing a venue (new portal).</div></div>

/* field checks: hard errors block the save; warnings are shown in the review */
function normalize(d){
  const o = {};
  for (const k of editFields()){
    let v = d[k];
    if (typeof v==="string") v = v.trim().replace(/^"+|"+$/g,"").trim();
    if (v==="" ) v = null;
    o[k]=v;
  }
  if (o.fintech_login_reference && FINTECH_NONE.has(o.fintech_login_reference.toLowerCase())) o.fintech_login_reference = null;
  if (!o.fintech_login_reference) { o.fintech_client_pos_id = o.fintech_client_pos_id || null; }
  o.status = (o.status||"active").toLowerCase();
  o.source_system = (o.source_system||"").toLowerCase();
  o.notes = o.notes || "";
  if (S.hasMapCols){ o.map_enabled = String(d.map_enabled)==="true"; const ch = d.map_choice||"auto"; if (ch==="auto"){ o.map_machine_picked = false; o.map_machine = S.edit.orig?.map_machine_picked ? null : (S.edit.orig?.map_machine ?? null); } else { o.map_machine_picked = true; o.map_machine = ch; } }
  if (o.audit_cycle!=="custom") o.custom_cycle_days = null;
  return o;
}
function check(o){
  const errs=[], warns=[]; const pre = POS_PREFIX[o.source_system];
  const looksLogin = s => /^(toast|spoton|mstarpos|mstar|square|silverware|fintech)\s*-/i.test(s||"");
  if (!o.client_display_name) errs.push("Client name is empty.");
  if (S.clients.some(c=>c.id!==S.edit.orig?.id && (c.client_display_name||"").toLowerCase()===(o.client_display_name||"").toLowerCase())) errs.push(`Another client is already called "${o.client_display_name}".`);
  if (!o.source_system) errs.push("Choose a POS.");
  if (AUTOMATED.has(o.source_system)){
    if (!o.login_reference) errs.push("POS login is empty — the pull cannot log in.");
    if (!o.client_pos_id) errs.push("POS venue name is empty — the pull cannot pick the venue.");
    if (o.login_reference && !looksLogin(o.login_reference)) errs.push(`POS login "${o.login_reference}" doesn't look like a 1Password item (they start "${pre} - ").${looksLogin(o.client_pos_id)?" It looks like the POS login and the venue name are swapped.":""}`);
    else if (o.login_reference && pre && !o.login_reference.toLowerCase().startsWith(pre.toLowerCase())) errs.push(`POS login "${o.login_reference}" is not a ${pre} login, but the POS is ${pre}.`);
    if (o.client_pos_id && looksLogin(o.client_pos_id)) errs.push(`POS venue name "${o.client_pos_id}" looks like a 1Password login, not a venue.`);
  }
  if (!AUTOMATED.has(o.source_system) && !o.fintech_login_reference) warns.push("This client has no automated POS and no Fintech login, so nothing will be pulled and the dates will not move.");
  if (o.fintech_login_reference && !/^fintech\s*-/i.test(o.fintech_login_reference)) errs.push(`Fintech login "${o.fintech_login_reference}" doesn't look like a Fintech 1Password item (they start "Fintech - ").`);
  if (o.fintech_client_pos_id && looksLogin(o.fintech_client_pos_id)) errs.push(`Fintech venue name "${o.fintech_client_pos_id}" looks like a 1Password login, not a venue.`);
  if (o.fintech_retailer_name && looksLogin(o.fintech_retailer_name)) errs.push(`Fintech retailer name "${o.fintech_retailer_name}" looks like a 1Password login.`);
  if (o.audit_cycle==="custom" && !(o.custom_cycle_days>0)) errs.push("A custom cycle needs the number of days.");
  if (o.status==="active"){
    if (!o.last_pulled_date) errs.push("An active client needs a last audit date (the pull starts there).");
    if (!o.next_due_date) errs.push("An active client needs a next audit date.");
  }
  if (o.last_pulled_date && o.next_due_date && o.next_due_date <= o.last_pulled_date) errs.push("Next audit date must be after the last audit date.");
  if (o.last_pulled_date && o.last_pulled_date > todayISO()) errs.push("Last audit date can't be in the future.");
  const cd = cycleDays(o.audit_cycle,o.custom_cycle_days);
  if (cd && o.last_pulled_date && o.next_due_date){ const gap = (new Date(o.next_due_date)-new Date(o.last_pulled_date))/864e5; if (gap!==cd) warns.push(`The gap between the two dates is ${gap} days; the cycle is ${cd}. Fine for a one-off, just confirming.`); }
  if (S.hasMapCols && o.map_enabled && !o.map_machine) warns.push("This client is set to map, but no machine is chosen yet. It maps once one audit machine holds it in Pilot, or once you pick one.");
  if (o.next_due_date && o.next_due_date < todayISO() && o.status==="active") warns.push("Next audit date is in the past — the 5am run will not pick it up. Use Run Now after saving.");
  return {errs,warns};
}
function changes(o){
  const orig = S.edit.orig; const out=[];
  for (const k of editFields()){
    const a = orig ? (orig[k]??null) : null, b = o[k]??null;
    const na = (a===""?null:a), nb=(b===""?null:b);
    if (String(na??"")!==String(nb??"")) out.push([k,na,nb]);
  }
  return out;
}
const pick = (list,v) => (list.find(x=>x[0]===v)||[0,v])[1];
const showVal = (k,v) => v===null||v===undefined||v==="" ? "(empty)" : /date/.test(k)?fmtLong(v):k==="audit_day_of_week"?DAYS[v]||v
  : k==="map_enabled"||k==="map_machine_picked"?(v===true||v==="true"?"Yes":"No") : k==="source_system"?pick(SOURCES,v):k==="audit_cycle"?pick(CYCLES,v):k==="status"?pick(STATUSES,v):String(v);

function startSave(andRun){
  const o = normalize(S.edit.draft); const {errs,warns} = check(o);
  if (errs.length){ S.edit.msg={kind:"err",html:"<b>Not saved — fix these first:</b><ul>"+errs.map(e=>`<li>${esc(e)}</li>`).join("")+"</ul>"}; drawEditor(); return; }
  const ch = changes(o);
  if (!ch.length && !andRun){ closeEditor(); toast("No changes."); return; }
  S.edit.review = {label: S.edit.orig ? (andRun?"Save and run now":"Save changes") : "Add client", o, ch, warns, andRun,
    run: ()=>doSave(o, ch, andRun)};
  drawEditor();
}
function reviewHTML(){
  const R = S.edit.review;
  return `<h3 style="margin-top:0">${S.edit.orig?"Check the changes":"Check the new client"}</h3>
   ${R.ch.length?`<div class="diff">${R.ch.map(([k,a,b])=>`<div><b>${esc(LABEL[k])}:</b> ${S.edit.orig?`<del>${esc(showVal(k,a))}</del> → `:""}<ins>${esc(showVal(k,b))}</ins></div>`).join("")}</div>`:`<p class="muted">No field changes.</p>`}
   ${R.warns.map(w=>`<div class="msg info">${esc(w)}</div>`).join("")}
   ${R.andRun?`<div class="msg info">After saving, a Run Now is queued for this client. ${hasFintech(R.o)&&AUTOMATED.has(R.o.source_system)?"Fintech runs first, then the POS.":""} It starts within about a minute.</div>`:""}`;
}
async function doSave(o, ch, andRun){
  const btn = $("#confirm"); btn.disabled=true; btn.textContent="Saving…";
  try{
    let id = S.edit.orig?.id;
    if (id){
      const patch = Object.fromEntries(ch.map(([k,,b])=>[k,b]));
      if (Object.keys(patch).length){ const r = await sb.from("clients").update(patch).eq("id",id).select("id"); if (r.error) throw r.error; if (!r.data?.length) throw new Error("The save did not reach the database (no row updated)."); }
    } else {
      const r = await sb.from("clients").insert(Object.assign(o,{last_pull_status:"never_attempted"})).select("id"); if (r.error) throw r.error; id = r.data[0].id;
    }
    if (andRun){ await queue({request_type:"run_now", client_id:id, source_system:o.source_system}, true); }
    closeEditor(); await refresh(); toast(andRun?"Saved, and Run Now queued — starts within a minute.":"Saved.");
  } catch(e){ S.edit.review=null; S.edit.msg={kind:"err",html:`<b>${andRun?"Not saved — run NOT queued.":"Not saved."}</b> ${esc(e.message||e)}`}; drawEditor(); }
}

/* ---------- client actions ---------- */
function actionsHTML(){
  const c = S.edit.orig; const failed = isFailed(c), delayed = isDelayed(c);
  const cd = cycleDays(c.audit_cycle,c.custom_cycle_days);
  return `<div class="actions">
    <div class="row"><p><b>Run Now</b><br><span class="muted small">Pulls ${fmtLong(c.last_pulled_date)} → ${fmtLong(c.next_due_date)} and, on success, advances the dates. Uses the saved details (unsaved edits are ignored — use Save + Run Now for those).</span></p><button class="b primary" id="a-run">Run Now</button></div>
    <div class="row"><p><b>Pull next audit's files</b><br><span class="muted small">Preview: pulls ${fmtLong(c.last_pulled_date)} → today into the client's Preview folder. Dates and statuses never change.</span></p><button class="b" id="a-prev">Pull preview</button></div>
    ${delayed?`<div class="row"><p><b>Delay reviewed</b><br><span class="muted small">Toast's data only ran to ${esc(c.toast_data_delay_last_update||"?")}. If this client was closed by then, the files are complete: this advances the dates (to ${fmtLong(c.next_due_date)} → ${cd?fmtLong(addDays(c.next_due_date,cd)):"?"}) and records that a person reviewed the delay.</span></p><button class="b warn" id="a-delay">Delay reviewed</button></div>`:""}
    ${failed||delayed?`<div class="row"><p><b>Mark as Manually Resolved</b><br><span class="muted small">For a pull the team completed by hand. Advances the dates (last audit becomes ${fmtLong(c.next_due_date)}, next audit ${cd?fmtLong(addDays(c.next_due_date,cd)):"?"}) and clears the failure.</span></p><button class="b warn" id="a-res">Mark resolved</button></div>`:""}
    <div class="row"><p><b>Delete client</b><br><span class="muted small">Removes the client from this list and from every pull. Pull history is kept.</span></p><button class="b danger" id="a-del">Delete</button></div>
  </div>`;
}
function wireActions(){
  const c = S.edit.orig;
  $("#a-run").onclick = ()=>actionConfirm("Run Now", `Queue a pull for ${c.client_display_name}?`, "Queue Run Now", async()=>{ await queue({request_type:"run_now",client_id:c.id,source_system:c.source_system}); });
  $("#a-prev").onclick = ()=>actionConfirm("Pull next audit's files", `Preview pull for ${c.client_display_name}, ${fmtLong(c.last_pulled_date)} → today. No dates change.`, "Pull preview", async()=>{ await queue({request_type:"run_preview",client_id:c.id,source_system:c.source_system}); });
  const res = async (reviewed)=>{
    const cd = cycleDays(c.audit_cycle,c.custom_cycle_days); if (!cd || !c.next_due_date) throw new Error("This client's audit cycle has no length, so the next date can't be worked out. Edit the dates instead.");
    const body = {last_pulled_date:c.next_due_date, next_due_date:addDays(c.next_due_date,cd), last_pull_status:"succeeded",
      fintech_last_pull_status: (c.fintech_last_pull_status||"").toLowerCase()==="failed" ? "succeeded" : (c.fintech_last_pull_status ?? null)};
    if (S.hasDelayCols && reviewed) body.delay_reviewed_at = new Date().toISOString();
    if (S.hasDelayCols && c.toast_data_delay==="delayed") body.toast_data_delay = "reviewed";
    const r = await sb.from("clients").update(body).eq("id",c.id).eq("next_due_date",c.next_due_date).select("id");
    if (r.error) throw r.error; if (!r.data?.length) throw new Error("The client changed since this page loaded — nothing was changed. Close and reopen it.");
  };
  if ($("#a-res")) $("#a-res").onclick = ()=>actionConfirm("Mark as Manually Resolved", `Advance ${c.client_display_name}'s dates and clear the failure? This can't be undone from here (the dates can be edited back by hand).`, "Mark resolved", ()=>res(false));
  if ($("#a-delay")) $("#a-delay").onclick = ()=>actionConfirm("Delay reviewed", `Confirm Toast's delay doesn't matter for ${c.client_display_name} and advance the dates?`, "Delay reviewed — advance dates", ()=>res(true));
  $("#a-del").onclick = ()=>actionConfirm("Delete client", `Delete ${c.client_display_name}? It disappears from this list and is never pulled again. Pull history is kept.`, "Delete client", async()=>{
    const r = await sb.from("clients").update({deleted_at:new Date().toISOString()}).eq("id",c.id).select("id"); if (r.error) throw r.error; if(!r.data?.length) throw new Error("Nothing was deleted."); });
}
function actionConfirm(title, text, label, fn){
  S.edit.review = {label, o:null, ch:[], warns:[], run: async()=>{ const b=$("#confirm"); b.disabled=true; b.textContent="Working…";
      try { await fn(); closeEditor(); await refresh(); toast(title+" — done."); }
      catch(e){ S.edit.review=null; S.edit.msg={kind:"err",html:`<b>${esc(title)} did not happen.</b> ${esc(e.message||e)}`}; drawEditor(); } }};
  drawEditor(); document.querySelector(".body").innerHTML = `<h3 style="margin-top:0">${esc(title)}</h3><p>${esc(text)}</p>`;
}
function confirmPanel(title, text, label, fn){
  S.edit = {orig:null, draft:blankClient(), tab:"schedule", msg:null, review:null};
  actionConfirm(title, text, label, fn);
  document.querySelector(".hd").innerHTML = `<h2>${esc(title)}</h2>`;
}
async function loadClientLog(){
  const c = S.edit.orig;
  const r = await sb.from("data_pulls").select("run_date,trigger_type,status,pull_start_date,pull_end_date,error_message,report_type").eq("client_id",c.id).order("started_at",{ascending:false}).limit(12);
  const el = $("#clog"); if (!el) return;
  if (r.error){ el.textContent = r.error.message; return; }
  el.classList.remove("muted");
  el.innerHTML = r.data.length ? `<div class="tablewrap"><table style="min-width:0"><thead><tr><th>Run</th><th>Trigger</th><th>Dates</th><th>Result</th></tr></thead><tbody>${r.data.map(p=>`<tr><td class="mono">${fmtDate(p.run_date)}</td><td>${esc({scheduled:"5am",manual:"Run Now",preview:"Preview"}[p.trigger_type]||p.trigger_type)}</td><td class="mono small">${fmtDate(p.pull_start_date)} → ${fmtDate(p.pull_end_date)}</td><td>${statusTag(p.status)}${p.error_message?`<div class="small" style="white-space:normal">${esc(p.error_message)}</div>`:""}</td></tr>`).join("")}</tbody></table></div>` : "No pulls recorded yet.";
}

/* one request per click, and never a second identical one while the first is waiting */
async function queue(row, quiet){
  let dup = sb.from("run_requests").select("id").eq("status","pending").eq("request_type",row.request_type);
  dup = row.client_id ? dup.eq("client_id",row.client_id) : dup.is("client_id",null);
  const d = await dup; if (d.error) throw d.error;
  if (d.data.length){ if(!quiet) toast("Already waiting in the queue — not added twice."); return; }
  const r = await sb.from("run_requests").insert(Object.assign({status:"pending"},row)).select("id");
  if (r.error) throw r.error;
  if (!quiet) toast(reqLabel(row.request_type)+" queued — starts within a minute.");
}
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),4500); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.edit && !S.edit.review) closeEditor(); });
boot();
</script>
</body>
</html>
