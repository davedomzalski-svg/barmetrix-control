<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barmetrix Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d2026;--muted:#646b76;--line:#e2e0da;--accent:#1f5f8b;
  --red:#c8372d;--red-bg:#fbe4e1;--blue:#1e6fc2;--blue-bg:#e1eefb;--amber:#a35f00;--amber-bg:#fdecd2;
  --yellow-bg:#fff7c9;--green:#2c7a45;--green-bg:#e2f3e7;--grey-bg:#eceae5;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171b;--panel:#1d2026;--ink:#e8e6e1;--muted:#9aa1ab;--line:#30343c;--accent:#6fb0e0;
  --red:#ff7b70;--red-bg:#4a1f1c;--blue:#7fb6f0;--blue-bg:#18324d;--amber:#f2b25c;--amber-bg:#46310f;
  --yellow-bg:#3d3713;--green:#79cf95;--green-bg:#183a24;--grey-bg:#2a2d33;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.01em}
nav{display:flex;gap:4px}
nav button{background:none;border:0;padding:6px 12px;border-radius:6px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--grey-bg);color:var(--ink);font-weight:500}
.who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center}
main{padding:16px max(16px,env(safe-area-inset-left)) 60px;max-width:1500px;margin:0 auto}
button.b{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:7px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--red);border-color:var(--red)}
button.warn{background:var(--amber);border-color:var(--amber);color:#fff}
button.big{padding:12px 22px;font-size:15px}
button:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:80px}
.banner{border-radius:8px;padding:10px 14px;margin-bottom:8px;border-left:4px solid}
.banner b{display:block;margin-bottom:2px}
.banner.red{background:var(--red-bg);border-color:var(--red)}
.banner.blue{background:var(--blue-bg);border-color:var(--blue)}
.banner.amber{background:var(--amber-bg);border-color:var(--amber)}
.banner.green{background:var(--green-bg);border-color:var(--green)}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.tablewrap.tall{overflow:auto;max-height:calc(100vh - 200px)}
.tablewrap.tall th{z-index:2;box-shadow:0 1px 0 var(--line)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text,inherit)}
th .arr{font-size:10px}
.mapcell{display:inline-flex;align-items:center;gap:8px}
input.ord{width:56px;padding:3px 6px;text-align:center}
.sw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:3px 10px 3px 4px;font:inherit;font-size:12px;cursor:pointer}
.sw i{width:26px;height:14px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{color:inherit;font-weight:600}
.sw.on i{background:#2e9d5b}
.sw.on i::after{left:14px}
.b.sm{padding:3px 8px;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;background:var(--panel);position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover td{filter:brightness(.97)}
tr.r-red td{background:var(--red-bg)} tr.r-blue td{background:var(--blue-bg)}
tr.r-amber td{background:var(--amber-bg)} tr.r-yellow td{background:var(--yellow-bg)}
td.mono,.mono{font-family:var(--mono);font-size:13px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--grey-bg);color:var(--muted)}
.tag.green{background:var(--green-bg);color:var(--green)} .tag.red{background:var(--red-bg);color:var(--red)}
.tag.blue{background:var(--blue-bg);color:var(--blue)} .tag.amber{background:var(--amber-bg);color:var(--amber)}
.muted{color:var(--muted)} .small{font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--panel);width:min(680px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer .hd{padding:18px 22px 0}
.drawer .hd h2{margin:0 0 4px;font-size:20px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:14px;padding:0 22px}
.tabs button{border:0;background:none;padding:10px 14px;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:500}
.body{padding:18px 22px;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ft .grow{flex:1}
.msg{padding:10px 12px;border-radius:7px;margin-bottom:12px}
.msg.err{background:var(--red-bg);color:var(--red)} .msg.ok{background:var(--green-bg);color:var(--green)}
.msg.info{background:var(--blue-bg)}
.diff{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.diff div{padding:2px 0}
.diff del{color:var(--red)} .diff ins{color:var(--green);text-decoration:none}
.actions{display:flex;flex-direction:column;gap:10px}
.actions .row{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px}
.actions .row p{margin:0;flex:1}
/* Dave 11/18: mapping questions "kind of mush together" - each one is its own numbered card */
.actions.qlist{gap:18px;counter-reset:q}
.actions.qlist .row{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;
  padding:14px 16px 16px;box-shadow:0 1px 3px rgba(0,0,0,.10);counter-increment:q}
.actions.qlist .row.mod{border-left-color:var(--amber)}
.actions.qlist .row.menu{border-left-color:var(--blue)}
.actions.qlist .row > p:first-child{padding-bottom:10px;border-bottom:1px solid var(--line);width:100%}
.actions.qlist .row > p:first-child > b{font-size:16px}
.actions.qlist .row > p:first-child::before{content:counter(q);display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:24px;padding:0 6px;margin-right:8px;border-radius:999px;background:var(--grey-bg);color:var(--ink);
  font-weight:600;font-size:13px;vertical-align:1px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:30;max-width:90vw}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.day{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;min-width:0}
.day .dn{font-weight:600}
.day.today{border-color:var(--accent)}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff}
.day.on .muted{color:#fff;opacity:.85}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard b{font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* Dave 11/24: one tight top bar - the email + Sign out sit in the menu row, never on a line of their own */
header{flex-wrap:nowrap;padding-top:8px;padding-bottom:8px}
header h1{white-space:nowrap}
nav{overflow-x:auto;min-width:0;flex:1}
nav button{white-space:nowrap}
.who{flex-shrink:0}
.who span{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .b{padding:5px 10px}
@media (max-width:1400px){.who span{display:none}}
@media (max-width:700px){header{flex-wrap:wrap}nav{flex-basis:100%;order:3}}
/* Dave 11/24: on one client's audit, the client, the back button, the open-questions bar and the tabs stay frozen */
.chead{position:sticky;top:var(--hdr,52px);z-index:4;background:var(--bg);margin:-16px calc(-1*max(16px,env(safe-area-inset-left))) 14px;
  padding:10px max(16px,env(safe-area-inset-left)) 0;border-bottom:1px solid var(--line);box-shadow:0 2px 4px rgba(0,0,0,.04)}
.chead .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.chead h2{margin:0;font-size:22px}
.chead .banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px;padding:8px 12px}
.chead .banner b{display:inline;margin:0;font-size:15px}
.chead .banner .grow{flex:1}
.chead .tabs{padding:0;margin:0;border-bottom:0}
/* Dave 11/24: the day's audits read like a dashboard - every card has the same rows in the same places */
.ccard.dash{gap:0;padding:14px 16px}
.ccards:has(.dash){grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.dash .ch{display:flex;align-items:baseline;gap:8px;width:100%}
.dash .ch b{font-size:16px;flex:1;min-width:0}
.dash .mach{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.dash .pos{margin-bottom:10px}
.dash .big{font-size:20px;font-weight:600;line-height:1.2;margin-bottom:2px}
.dash .big.red{color:var(--red)} .dash .big.green{color:var(--green)} .dash .big.amber{color:var(--amber)} .dash .big.grey{color:var(--muted);font-size:16px;font-weight:500}
.dash .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:12px 0 5px;width:100%;border-top:1px solid var(--line);padding-top:8px}
.dash .steps{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.dash .steps span{white-space:nowrap}
.dash .steps .ok{color:var(--green);font-weight:500} .dash .steps .no{color:var(--muted)}
.dash .pass{font-size:13px;font-weight:500}
.dash .pass.red{color:var(--red)} .dash .pass.green{color:var(--green)} .dash .pass.blue{color:var(--blue)} .dash .pass.amber{color:var(--amber)} .dash .pass.grey{color:var(--muted);font-weight:400}
.dash .dgrid{display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;font-size:13px}
.dash .dgrid .sub{padding-left:14px;color:var(--muted)}
.dash .dgrid .v{text-align:right;font-family:var(--mono);font-weight:600;min-width:2ch}
.dash .dgrid .v.red{color:var(--red)} .dash .dgrid .v.amber{color:var(--amber)} .dash .dgrid .v.blue{color:var(--blue)} .dash .dgrid .v.green{color:var(--green)}
.dash .act{margin-top:auto;padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;width:100%}
@media (max-width:900px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const C = window.BARMETRIX_CONFIG || {};
const sb = window.supabase.createClient(C.supabaseUrl, C.supabaseAnonKey);
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const SOURCES = [["toast","Toast"],["spoton","SpotOn"],["mstarpos","MStar"],["square","Square"],["silverware","Silverware (not automated)"],["none","None — Fintech only"]];
const AUTOMATED = new Set(["toast","spoton","mstarpos","square"]);
const POS_PREFIX = {toast:"Toast",spoton:"SpotOn",mstarpos:"MstarPOS",square:"Square",silverware:"Silverware"};
const CYCLES = [["weekly","Weekly"],["biweekly","Every 2 weeks"],["4-week","Every 4 weeks"],["custom","Custom"],["on_hold","On hold"]];
const STATUSES = [["active","Active"],["paused","Paused"],["onboarding","Onboarding"]];
const DAYS = ["","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const FINTECH_NONE = new Set(["","no","none","no fintech"]);
const EDIT_FIELDS = ["client_display_name","source_system","login_reference","client_pos_id","audit_cycle","audit_day_of_week","custom_cycle_days","last_pulled_date","next_due_date","status","notes","fintech_login_reference","fintech_client_pos_id","fintech_retailer_name"];
const editFields = () => S.hasMapCols ? EDIT_FIELDS.concat(["map_enabled","map_machine","map_machine_picked","pilot_name"]) : EDIT_FIELDS;
const LABEL = {map_enabled:"Map this client",map_machine:"Mapping machine",map_machine_picked:"Machine chosen by a person",pilot_name:"Name in Pilot",client_display_name:"Client name",source_system:"POS",login_reference:"POS login (1Password item)",client_pos_id:"POS venue name / ID",audit_cycle:"Audit cycle",audit_day_of_week:"Audit day",custom_cycle_days:"Custom cycle days",last_pulled_date:"Last audit date",next_due_date:"Next audit date",status:"Client status",notes:"Notes",fintech_login_reference:"Fintech login (1Password item)",fintech_client_pos_id:"Fintech venue name",fintech_retailer_name:"Fintech retailer name"};

let S = {user:null, view:"clients", clients:[], queue:[], pulls:[], machines:[], jobs:[], hasDelayCols:true, hasMapCols:true, hasWinCol:true, timer:null, edit:null};

/* ---------- dates ---------- */
const todayISO = () => { const d = new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const addDays = (iso,n) => { const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fmtDate = iso => { if(!iso) return "—"; const d = new Date(String(iso).slice(0,10)+"T12:00:00"); return d.toLocaleDateString("en-US",{weekday:"short",month:"2-digit",day:"2-digit",year:"numeric"}); };
const fmtLong = iso => { if(!iso) return "—"; const d = new Date(String(iso).slice(0,10)+"T12:00:00"); return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}); };
const fmtShort = iso => { if(!iso) return "—"; const d = new Date(String(iso).slice(0,10)+"T12:00:00"); return d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); };
const fmtTime = ts => ts ? new Date(ts).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "—";
const cycleDays = (c,custom) => ({weekly:7,biweekly:14,"4-week":28}[c] || (c==="custom" ? parseInt(custom)||0 : 0));

/* ---------- client state ---------- */
const hasFintech = c => !FINTECH_NONE.has(String(c.fintech_login_reference||"").trim().replace(/^"+|"+$/g,"").toLowerCase());
const isFailed = c => (c.last_pull_status||"").toLowerCase()==="failed" || (c.fintech_last_pull_status||"").toLowerCase()==="failed";
const isDelayed = c => c.toast_data_delay==="delayed" && (c.last_pull_status||"")==="failed";
function rowClass(c){
  if (isDelayed(c)) return "r-blue";
  if (isFailed(c)) return "r-red";
  if ((c.status||"").toLowerCase()==="paused") return "r-amber";
  if ((c.status||"").toLowerCase()==="active" && c.next_due_date && c.next_due_date < todayISO()) return "r-yellow";
  return "";
}
function statusTag(v){
  const s = (v||"").toLowerCase();
  if (!s) return '<span class="tag">—</span>';
  const cls = s==="succeeded"?"green":s==="failed"?"red":s==="pending"?"amber":"";
  const txt = {succeeded:"Succeeded",failed:"Failed",pending:"Pending",never_attempted:"Never run"}[s] || s;
  return `<span class="tag ${cls}">${esc(txt)}</span>`;
}

/* ---------- data ---------- */
const CLIENT_COLS = "id,client_display_name,source_system,login_reference,client_pos_id,audit_cycle,audit_day_of_week,custom_cycle_days,last_pulled_date,next_due_date,status,notes,last_pull_status,fintech_last_pull_status,fintech_login_reference,fintech_client_pos_id,fintech_retailer_name,deleted_at,updated_at";
const DELAY_COLS = ",toast_data_delay,toast_data_delay_last_update,toast_data_delay_checked_at,delay_reviewed_at";

const MAP_COLS = ",map_enabled,map_machine,map_machine_picked,pilot_name";
async function loadClients(){
  let q = await sb.from("clients").select(CLIENT_COLS + (S.hasDelayCols?DELAY_COLS:"") + (S.hasMapCols?MAP_COLS:"") + (S.hasWinCol?",recipe_delete_after_months":"")).is("deleted_at",null).order("client_display_name");
  if (q.error && S.hasWinCol && /recipe_delete/i.test(q.error.message)) { S.hasWinCol = false; return loadClients(); }
  if (q.error && S.hasMapCols && /map_|pilot_name/i.test(q.error.message)) { S.hasMapCols = false; return loadClients(); }
  if (q.error && S.hasDelayCols && /column/i.test(q.error.message)) { S.hasDelayCols = false; return loadClients(); }
  if (q.error) throw q.error;
  S.clients = q.data;
  // STEP 13 (11/16): the run order on each client + the ONE master switch for all robot mapping
  const o = await sb.from("clients").select("id,map_order").is("deleted_at",null);
  S.hasOrderCol = !o.error;
  if (!o.error){ const by = new Map(o.data.map(r=>[r.id, r.map_order])); S.clients.forEach(c=>c.map_order = by.get(c.id) ?? null); }
  const ms = await sb.from("robot_settings").select("value,updated_by,updated_at").eq("key","mapping").maybeSingle();
  S.master = (ms.error || !ms.data) ? null : {on: !!(ms.data.value||{}).on, by: ms.data.updated_by, at: ms.data.updated_at};
  // each Pilot client behind a shared-login row: its own computer + robot switch (Dave 11/24; robot reads the same)
  const sp = await sb.from("robot_settings").select("value").eq("key","pilot_split").maybeSingle();
  S.split = (sp.error || !sp.data) ? {} : (sp.data.value || {});
  if (S.hasMapCols){
    const m = await sb.from("machines").select("*").order("name");
    S.machines = m.error ? [] : m.data;
    const j = await sb.from("map_jobs").select("*").gte("requested_at", addDays(todayISO(),-10)+"T00:00:00").order("requested_at",{ascending:false}).limit(500);
    S.jobs = j.error ? [] : j.data;
  }
}
/* ---------- mapping machines ---------- */
const MACHINE_FRESH = 15*60e3;
// Robot computers that need a person (Dave 11/15: no silent failures). Only computers that map a client.
const machineProblems = () => {
  const mapping = new Set(S.clients.filter(c=>c.map_enabled && c.map_machine).map(c=>c.map_machine));
  const out = [];
  for (const m of (S.machines||[])){
    if (!mapping.has(m.name)) continue;
    const v = m.agent_version||"", who = m.name.replace(/^MIAMI-/,"");
    if (Date.now()-new Date(m.last_checkin) > MACHINE_FRESH)
      out.push(`<b>${esc(who)}</b> hasn't checked in (last seen ${esc(ago(m.last_checkin))}): its clients won't map. Make sure it is on and signed in to Windows.`);
    if (/reasoning (FAILS|NO)/.test(v))
      out.push(`<b>${esc(who)}</b>: the robot's Claude can't answer, so every new button waits for you. On ${esc(who)}, double-click <b>SIGN IN - robot Claude</b> in Drive › Barmetrix Automation › Mapping Robot.`);
    if (/task (MISSING|has NO next run)/.test(v))
      out.push(`<b>${esc(who)}</b>: the robot's 5-minute restart is broken. On ${esc(who)}, double-click <b>INSTALL</b> in Drive › Barmetrix Automation › Mapping Robot.`);
  }
  return out;
};
const normName = s => String(s||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"");

/* ---------- Computers: who maps what (Dave 11/18: "I can not see how to set clients to a machine. Let's put this
   in the top menu and make it super user friendly"). One row per client, tomorrow's audits first: a switch for robot
   mapping and one button per computer, each saying whether that computer's Pilot holds the client and how fresh. */
const CM = {q:""};
const shortName = n => String(n||"").replace(/^MIAMI-/,"");
/* Logins that aren't one-to-one with Pilot clients (Dave 11/24: "That is 2 clients, not one"). Same pairs as
   context/client_links.json on the robot - keep the two in step.
   PILOT_CLIENTS_OF: one Command Center row (one Toast login, one pull) = several Pilot clients, mapped together.
   POS_LOGIN_OF: a pull-only login whose sales go into ANOTHER client's Pilot client. */
const PILOT_CLIENTS_OF = {"Coasnostra & El Cuban Diner": ["Cosanostra", "El Cuban Diner"]};
const POS_LOGIN_OF = {"The Naked Tomato": "Moxy Hotel"};
const pilotsOf = c => c._pilot ? [c._pilot] : PILOT_CLIENTS_OF[c.client_display_name] || [c.pilot_name||c.client_display_name];
/* One Pilot client of a shared-login row, as its own client: its computer and switch come from robot_settings
   'pilot_split' (falling back to the row's). Dave 11/24: "They are separate clients in Pilot so they are separate here." */
function viewOf(c, venue){
  if (!c || !PILOT_CLIENTS_OF[c.client_display_name] || !venue) return c;
  const p = PILOT_CLIENTS_OF[c.client_display_name].find(x=>normName(x)===normName(venue)) || venue;
  const s = (S.split||{})[p] || {};
  return Object.assign({}, c, {_row:c, _pilot:p, pilot_name:p,
    map_machine: "map_machine" in s ? s.map_machine : c.map_machine,
    map_enabled: "map_enabled" in s ? !!s.map_enabled : c.map_enabled});
}
/* Save one Pilot client's computer / switch. Every Pilot client of the row gets an entry (so the row's own columns
   never silently move the other one), and the row mirrors the first Pilot client for the older screens. */
async function savePilot(v, patch){
  const row = v._row, names = PILOT_CLIENTS_OF[row.client_display_name];
  const fresh = await sb.from("robot_settings").select("value").eq("key","pilot_split").maybeSingle();
  if (fresh.error) return fresh.error.message;
  const split = Object.assign({}, (fresh.data&&fresh.data.value)||{});
  names.forEach(p=>{ const cur = viewOf(row, p); split[p] = Object.assign({map_machine:cur.map_machine, map_enabled:!!cur.map_enabled}, split[p]||{}); });
  split[v._pilot] = Object.assign({}, split[v._pilot], patch);
  const r = await sb.from("robot_settings").update({value:split, updated_by:S.user.email, updated_at:new Date().toISOString()}).eq("key","pilot_split").select("key");
  if (r.error || !r.data?.length) return r.error?.message || "no settings row";
  S.split = split;
  const first = split[names[0]];
  const m = await sb.from("clients").update({map_machine:first.map_machine, map_machine_picked:true, map_enabled:names.some(p=>split[p].map_enabled)}).eq("id",row.id).select("id");
  if (!m.error && m.data?.length){ row.map_machine = first.map_machine; row.map_machine_picked = true; row.map_enabled = names.some(p=>split[p].map_enabled); }
  return null;
}
const partOf = c => POS_LOGIN_OF[c.client_display_name]
  || (!c.pilot_name && Object.entries(PILOT_CLIENTS_OF).find(([k,v])=>k!==c.client_display_name && v.some(p=>normName(p)===normName(c.client_display_name)))?.[0])
  || null;
const syncOf = (m, name) => (m.clients_held||[]).find(h=>normName(h.name)===normName(name));
const daysAgo = ts => ts ? Math.floor((Date.now()-new Date(ts))/864e5) : null;
function holdNote(m, c){
  // every Pilot client behind this row must be in that computer's Pilot; show the worst one
  const notes = pilotsOf(c).map(p=>{
    const h = syncOf(m, p), who = pilotsOf(c).length>1 ? `${p}: ` : "";
    if (!h) return {cls:"red", rank:0, txt:`${who}not in its Pilot`};
    const d = daysAgo(h.last_sync);
    const when = h.last_sync ? new Date(h.last_sync).toLocaleDateString("en-US",{month:"short",day:"numeric"}) : "never";
    return d!=null && d>14 ? {cls:"amber", rank:1, txt:`${who}synced ${when} — sync it first`} : {cls:"green", rank:2, txt:`holds it · synced ${when}`};
  });
  return notes.sort((a,b)=>a.rank-b.rank)[0];
}

  $("#main").innerHTML = `
    <div class="bar" style="align-items:baseline"><h2 style="margin:0;font-size:22px">Computers — who maps what</h2>
      <span class="grow"></span>${S.master?`<span class="tag ${S.master.on?"green":"red"}">Robot mapping ${S.master.on?"ON":"OFF"} for all</span>`:""}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">${ms.map(card).join("") || '<span class="muted">No robot computer has checked in yet.</span>'}</div>
    <div class="bar"><input id="cmq" placeholder="Find a client" value="${esc(CM.q)}" style="max-width:280px">
      <span class="muted small">Click a computer to choose who maps the client. The switch turns the robot on or off for that client.</span></div>
    <div class="tablewrap"><table style="min-width:760px"><thead><tr><th>Client</th><th>Next audit</th><th>Robot</th><th>Mapped on</th></tr></thead>

  document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=async()=>{

      if (err){ toast("Not saved: "+err); b.disabled=false; return; }
      toast(`${c._pilot}: robot mapping ${on?"on":"off"}.`); renderComputers(); return; }
    const r = await sb.from("clients").update({map_enabled:on}).eq("id",c.id).select("id");

    if (r.error||!r.data?.length){ toast("Not saved: "+(r.error?.message||"no row")); renderComputers(); return; }

/* ---------- database review: dead recipes first (more checks join later) ----------
   Pilot rebuilds every report from TODAY's recipes, so deleting a recipe changes any old audit
   that is run again. A recipe is only offered here once its last sale is older than the client's
   "safe to delete after" window (clients.recipe_delete_after_months). */
const D = {ready:true, sum:[], client:null, items:[], tab:"open", sel:new Set(), q:""};
const DB_WINDOWS = [3,6,9,12,18,24];
const DB_KEEP_MONTHS = 3;   // "Keep" is a snooze, not forever (Dave 11/11/2026); tools/db_review.py KEEP_MONTHS
const keepUntil = ts => { const d = new Date(ts); d.setMonth(d.getMonth()+DB_KEEP_MONTHS); return d.toISOString().slice(0,10); };
const DB_COLS = "id,client_id,venue,kind,recipe,last_sold,units_ever,buttons_mapped,last_counted,suggestion,reason,status,choice,decided_by,decided_at,applied_at,applied_detail,found_at";
const DB_TABS = [["open","Waiting for a decision"],["decided","Approved — the robot deletes next"],["applied","Deleted"],["kept","Kept"]];
const dbOpenTotal = () => D.sum.filter(r=>r.status==="open").reduce((a,r)=>a+r.n,0) + (D.clean||[]).filter(r=>r.status==="open").length;
const dbTabOf = r => r.status==="open" ? "open" : r.status==="applied" ? "applied" : (r.choice==="keep"||r.choice==="reject") ? "kept" : r.status==="decided" ? "decided" : r.status==="failed" ? "decided" : null;

async function loadDb(){
  const q = await sb.from("db_review_summary").select("*");
  if (q.error){ D.ready = !/relation|does not exist|schema cache|column/i.test(q.error.message); if (!D.ready) return; throw q.error; }
  D.ready = true; D.sum = q.data;
  const r = await sb.from("db_review_runs").select("*").order("requested_at",{ascending:false}).limit(1);
  D.run = r.error ? null : (r.data[0] || null);
  // cleanup review findings (tools/cleanup_review.py, Dave 11/22): mapping_items kind 'cleanup', no audit date
  const cq = await sb.from("mapping_items").select("client_id,venue,status,choice").eq("kind","cleanup");
  D.clean = cq.error ? [] : cq.data;
  if (D.client) await loadDbItems();
  if (D.cclient && S.view==="dbreview") await loadCleanItems();   // shares M.items with Mapping - see loadMapping
}
function runLine(){
  const r = D.run;
  if (!r) return `<span class="muted small">Not run from here yet.</span>`;
  const who = esc((r.requested_by||"").split("@")[0]);
  if (r.status==="queued") return `<span class="tag amber">Waiting for the robot's computer</span> <span class="muted small">asked by ${who} ${esc(ago(r.requested_at))}. It starts within a minute when that computer is on.</span>`;
  if (r.status==="running") return `<span class="tag blue">Running on ${esc(r.machine||"")}</span> <span class="muted small">started ${esc(ago(r.started_at))}</span>`;
  if (r.status==="failed") return `<span class="tag red">Last run failed</span> <span class="muted small">${esc(fmtTime(r.finished_at))} · ${esc(r.summary||"")}</span>`;
  return `<span class="tag green">Last run ${esc(fmtTime(r.finished_at))}</span> <span class="muted small">${esc(r.summary||"")}</span>`;
}
async function runDbReview(btn){
  btn.disabled = true;
  const r = await sb.from("db_review_runs").insert({requested_by:S.user.email}).select("id");
  if (r.error){ toast("Not started: "+r.error.message); btn.disabled = false; return; }
  toast("Asked the robot to run the database review. The list refreshes when it finishes.");
  await loadDb().catch(()=>{}); renderDb();
  const t0 = Date.now();
  const tick = setInterval(async()=>{                     // follow it until it finishes (max 15 min)
    await loadDb().catch(()=>{});
    if (S.view==="dbreview" && !D.client) renderDb();
    if (!D.run || ["done","failed"].includes(D.run.status) || Date.now()-t0 > 15*60e3) clearInterval(tick);
  }, 15000);
}
async function loadDbItems(){
  const c = D.client, out = [];
  for (let from=0; ; from+=1000){
    let q = sb.from("db_review_items").select(DB_COLS).eq("kind","dead");
    q = c.cid ? q.eq("client_id",c.cid) : q.eq("venue",c.venue).is("client_id",null);
    const r = await q.order("last_sold",{ascending:true,nullsFirst:true}).order("recipe").range(from, from+999);
    if (r.error) throw r.error;
    out.push(...r.data);
    if (r.data.length < 1000) break;
  }
  D.items = out.filter(r=>r.status!=="gone");
  const live = new Set(D.items.map(r=>r.id));
  [...D.sel].forEach(id=>{ if (!live.has(id)) D.sel.delete(id); });
}
function dbCards(){
  const cards = new Map();
  D.sum.filter(r=>r.kind==="dead" && r.status!=="gone").forEach(r=>{
    const k = ckey(r.client_id, r.venue);
    if (!cards.has(k)) cards.set(k, {cid:r.client_id, venue:r.venue, open:0, decided:0, applied:0, last:r.last_found});
    const x = cards.get(k);
    if (r.status==="open") x.open+=r.n; else if (r.status==="applied") x.applied+=r.n; else if (r.status==="decided") x.decided+=r.n;
    if (r.last_found > x.last) x.last = r.last_found;
  });
  return [...cards.values()].map(x=>{ const c = x.cid && clientOf(x.cid); return Object.assign(x, {client:c, name: c ? c.client_display_name : x.venue}); })
    .sort((a,b)=> b.open-a.open || a.name.localeCompare(b.name));
}
const windowOf = c => (c && c.recipe_delete_after_months) || 12;
function windowSelect(c){
  if (!c) return `<span class="muted small">12 months (link this Pilot name to a client to change it)</span>`;
  return `<select data-win="${esc(c.id)}" style="max-width:150px">${DB_WINDOWS.map(m=>`<option value="${m}" ${windowOf(c)===m?"selected":""}>${m} months</option>`).join("")}</select>`;
}
async function saveWindow(sel){
  const m = parseInt(sel.value), c = S.clients.find(x=>x.id===sel.dataset.win);
  const r = await sb.from("clients").update({recipe_delete_after_months:m}).eq("id",c.id).select("id");
  if (r.error||!r.data?.length){ toast("Not saved: "+(r.error?.message||"no row")); sel.value = windowOf(c); return; }
  c.recipe_delete_after_months = m;
  toast(`Saved: ${c.client_display_name} — ${m} months. The list updates on the robot's next scan.`);
}

function renderDb(){
  if (!D.ready){ $("#main").innerHTML = `<div class="msg info"><b>The Database Review isn't switched on in the database yet.</b> Run "STEP 7 - SUPABASE - database review" (Google Drive → My Drive → Barmetrix Automation) in the Supabase SQL Editor, then reload this page.</div>`; return; }
  if (D.client) return renderDbClient();
  if (D.cclient) return renderCleanClient();
  const cards = dbCards();
  const busy = D.run && ["queued","running"].includes(D.run.status);
  $("#main").innerHTML = `
    <div class="bar"><button class="b primary" id="drun" ${busy?"disabled":""}>Run the database review now</button><div>${runLine()}</div></div>
    <div class="banner blue"><b>Dead recipes</b>Recipes that haven't sold, or been counted on the shelf, for longer than the client's "safe to delete after" window.
      Pilot rebuilds every report from today's recipes, so a deleted recipe disappears from any old audit that is run again. The window keeps every audit the client still looks back at untouched.</div>
    ${cards.length ? `<div class="ccards">${cards.map((x,i)=>`<div class="ccard" data-dc="${i}">
        <b>${esc(x.name)}</b>
        <div class="chips">${x.open?`<span class="tag amber">${x.open} waiting</span>`:""}${x.decided?`<span class="tag blue">${x.decided} approved</span>`:""}${x.applied?`<span class="tag green">${x.applied} deleted</span>`:""}${!x.open&&!x.decided&&!x.applied?'<span class="tag">Nothing waiting</span>':""}</div>
        <div class="small muted">Safe to delete after</div>
        <div onclick="event.stopPropagation()">${windowSelect(x.client)}</div>
        <div class="small muted">Last scan ${esc(fmtTime(x.last))}</div></div>`).join("")}</div>`
      : `<p class="muted">Nothing found yet. Press "Run the database review now".</p>`}${cleanSection()}`;
  $("#drun").onclick = e=>runDbReview(e.currentTarget);
  document.querySelectorAll("[data-cl]").forEach(el=>el.onclick=async()=>{ const x = cleanCards()[+el.dataset.cl];
    D.cclient = {cid:x.cid, venue:x.venue, name:x.name}; D.ctab = "open"; M.other = null; M.ask = null;
    try { await loadCleanItems(); } catch(e){ toast("Could not load: "+(e.message||e)); } renderDb(); });
  document.querySelectorAll("[data-win]").forEach(s=>s.onchange=()=>saveWindow(s));
  document.querySelectorAll("[data-dc]").forEach(el=>el.onclick=async()=>{ const x = cards[+el.dataset.dc];
    D.client = {cid:x.cid, venue:x.venue, name:x.name}; D.tab="open"; D.sel = new Set(); D.q="";
    try { await loadDbItems(); } catch(e){ toast("Could not load: "+(e.message||e)); } renderDb(); });
}
function renderDbClient(){
  const c = D.client, cl = c.cid && clientOf(c.cid);
  const inTab = D.items.filter(r=>dbTabOf(r)===D.tab);
  const q = D.q.trim().toLowerCase();
  const rows = q ? inTab.filter(r=>r.recipe.toLowerCase().includes(q)) : inTab;
  const counts = Object.fromEntries(DB_TABS.map(([k])=>[k, D.items.filter(r=>dbTabOf(r)===k).length]));
  const open = D.tab==="open";
  const ticked = rows.filter(r=>D.sel.has(r.id)).length;
  $("#main").innerHTML = `
    <div class="bar"><button class="b" id="dback">← All clients</button><h2 style="margin:0 8px;font-size:18px">${esc(c.name)} — dead recipes</h2>
      <span class="grow"></span><span class="small muted">Safe to delete after</span>${windowSelect(cl)}</div>
    <div class="tabs" style="padding:0;margin:0 0 12px">${DB_TABS.map(([k,l])=>`<button data-dt="${k}" class="${D.tab===k?"on":""}">${l} (${counts[k]})</button>`).join("")}</div>
    <div class="bar"><input id="dq" placeholder="Search recipes" value="${esc(D.q)}" style="max-width:280px">
      ${open?`<button class="b" id="dall">Tick all ${rows.length}</button><button class="b" id="dnone">Untick all</button><span class="grow"></span>
      <button class="b" id="dkeep" ${ticked?"":"disabled"}>Keep the ${ticked} ticked for ${DB_KEEP_MONTHS} months</button>
      <button class="b danger" id="dok" ${ticked?"":"disabled"}>Approve deleting the ${ticked} ticked</button>`:""}</div>
    ${open?`<p class="small muted" style="margin:0 0 10px">Approving deletes the recipe in Pilot. Any POS button still mapped to it is unmapped at the same time, so if that button ever rings again it shows up as unmapped instead of depleting nothing. Pilot's delete also removes the recipe's past sales from every audit; every one listed here last sold before the client's window, so no audit the client still looks back at changes. "Keep" puts it away for ${DB_KEEP_MONTHS} months; if it still hasn't sold by then, it comes back here.</p>`:""}
    ${rows.length ? `<div class="tablewrap"><table style="min-width:760px"><thead><tr>${open?"<th></th>":""}<th>Recipe</th><th>Last sold</th><th>Units sold (all time)</th><th>Buttons mapped</th><th>Last counted</th><th>${open?"Why":"Decided"}</th></tr></thead><tbody>
      ${rows.map(r=>`<tr data-dr="${esc(r.id)}">${open?`<td><input type="checkbox" ${D.sel.has(r.id)?"checked":""} style="width:auto"></td>`:""}
        <td>${esc(r.recipe)}</td><td>${r.last_sold?esc(fmtDate(r.last_sold)):'<span class="muted">No sale on record</span>'}</td>
        <td class="mono">${Number(r.units_ever||0).toLocaleString()}</td><td class="mono">${r.buttons_mapped||0}</td>
        <td>${r.last_counted?esc(fmtDate(r.last_counted)):'<span class="muted">—</span>'}</td>
        <td class="small" style="white-space:normal;min-width:260px">${open?esc(r.reason||""):`${esc(r.decided_by||"")}${r.decided_at?" · "+esc(fmtTime(r.decided_at)):""}${D.tab==="kept"&&r.decided_at?`<div class="muted">Comes back ${esc(fmtDate(keepUntil(r.decided_at)))} if it still hasn't sold</div>`:""}${r.applied_detail?`<div class="muted">${esc(r.applied_detail)}</div>`:""}`}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted">${q?"No recipe matches that search.":"Nothing here."}</p>`}`;
  $("#dback").onclick = async()=>{ D.client=null; await loadDb().catch(()=>{}); renderDb(); };
  document.querySelectorAll("[data-win]").forEach(s=>s.onchange=()=>saveWindow(s));
  document.querySelectorAll("[data-dt]").forEach(b=>b.onclick=()=>{ D.tab=b.dataset.dt; renderDbClient(); });
  const dq = $("#dq"); dq.oninput = ()=>{ D.q = dq.value; const p = dq.selectionStart; renderDbClient(); const n=$("#dq"); n.focus(); n.setSelectionRange(p,p); };
  if (open){
    document.querySelectorAll("[data-dr]").forEach(tr=>tr.onclick=e=>{ const id = tr.dataset.dr; D.sel.has(id)?D.sel.delete(id):D.sel.add(id); renderDbClient(); });
    $("#dall").onclick = ()=>{ rows.forEach(r=>D.sel.add(r.id)); renderDbClient(); };
    $("#dnone").onclick = ()=>{ rows.forEach(r=>D.sel.delete(r.id)); renderDbClient(); };
    $("#dok").onclick = ()=>decideDb(rows.filter(r=>D.sel.has(r.id)), "approve");
    $("#dkeep").onclick = ()=>decideDb(rows.filter(r=>D.sel.has(r.id)), "keep");
  }
}
/* ---------- cleanup review (Dave 11/22: "we need to clean this database") ----------
   tools/cleanup_review.py: the full Claude session reviews what a client SELLS - every sold button's mapping, sold
   buttons on the trash list, every recipe they use - and each real problem becomes a card here (mapping_items kind
   'cleanup', no audit date: it belongs to no audit day). Cards are question-library cards; approving one and pressing
   "Write approved fixes to Pilot now" writes it (mapping re-map, or the recipe rows changed in place). */
const CLEAN_TABS = [["open","Waiting for a decision"],["decided","Approved — not written yet"],["applied","Done"],["kept","Kept as it is"]];
const cleanTabOf = r => r.status==="open" ? "open" : r.status==="applied" ? "applied" : r.choice==="reject" ? "kept" : r.status==="decided"||r.status==="failed" ? "decided" : null;
function cleanCards(){
  const cards = new Map();
  (D.clean||[]).forEach(r=>{
    const k = ckey(r.client_id, r.venue);
    if (!cards.has(k)) cards.set(k, {cid:r.client_id, venue:r.venue, open:0, decided:0, applied:0, kept:0});
    const t = cleanTabOf(r); if (t) cards.get(k)[t]++;
  });
  return [...cards.values()].map(x=>{ const c = x.cid && clientOf(x.cid); return Object.assign(x, {client:c, name:c?c.client_display_name:x.venue}); })
    .sort((a,b)=> b.open-a.open || a.name.localeCompare(b.name));
}
function cleanSection(){
  const cards = cleanCards();
  return `<div class="banner blue" style="margin-top:22px"><b>Cleanup review</b>Wrong mappings and recipes found in what each client actually sells: cocktails mapped to a bare spirit, wrong brands, bottle/glass mix-ups, pours that don't match the venue's own, recipes with the wrong spirit or impossible amounts. Nothing changes in Pilot until a fix is approved and written.</div>
    ${cards.length ? `<div class="ccards">${cards.map((x,i)=>`<div class="ccard" data-cl="${i}" role="button" tabindex="0"><b>${esc(x.name)}</b>
      <div class="chips">${x.open?`<span class="tag amber">${x.open} waiting</span>`:""}${x.decided?`<span class="tag blue">${x.decided} approved</span>`:""}${x.applied?`<span class="tag green">${x.applied} done</span>`:""}${x.kept?`<span class="tag">${x.kept} kept</span>`:""}</div></div>`).join("")}</div>`
      : `<p class="muted">No cleanup review has been run yet.</p>`}`;
}
async function loadCleanItems(){
  const c = D.cclient;
  const r = await sb.from("mapping_items").select(ITEM_COLS + ",options,chosen").eq("kind","cleanup").eq("client_id", c.cid).order("title");
  if (r.error) throw r.error;
  M.items = r.data;                                   // libCard / askBox read M
}
function cleanJob(cid){
  return S.jobs.find(j=>j.client_id===cid && (j.detail||{}).cleanup && ["queued","running"].includes(j.status));
}
function renderCleanClient(){
  const c = D.cclient, cl = viewOf(clientOf(c.cid), c.venue), items = M.items||[];
  const counts = Object.fromEntries(CLEAN_TABS.map(([k])=>[k, items.filter(r=>cleanTabOf(r)===k).length]));
  const inTab = items.filter(r=>cleanTabOf(r)===D.ctab);
  const toWrite = items.filter(r=>r.status==="decided" && !["reject","wait_count","created"].includes(r.choice)).length;
  const job = cleanJob(c.cid);
  const last = S.jobs.filter(j=>j.client_id===c.cid && (j.detail||{}).cleanup && ["done","failed"].includes(j.status))
    .sort((a,b)=>String(b.finished_at).localeCompare(String(a.finished_at)))[0];
  $("#main").innerHTML = `
    <div class="bar"><button class="b" id="cback">← All clients</button><h2 style="margin:0 8px;font-size:18px">${esc(c.name)} — cleanup review</h2></div>
    ${job ? `<div class="banner blue"><b>Writing fixes to Pilot on ${esc(job.machine||"")}…</b>${job.status==="queued"?"Waiting for that computer (under a minute when it's on).":"Running now."}</div>`
      : toWrite ? `<div class="bar"><button class="b primary" id="cwrite">Write ${toWrite} approved fix${toWrite>1?"es":""} to Pilot now</button>
          <span class="muted small">Recipe changes also change past reports (Pilot rebuilds them from today's recipes).</span></div>` : ""}
    ${last?`<div class="muted small" style="margin:0 0 10px">Last write: ${esc(fmtTime(last.finished_at))} — ${esc(last.summary||last.status)}</div>`:""}
    <div class="tabs" style="padding:0;margin:0 0 14px">${CLEAN_TABS.map(([k,l])=>`<button data-ct="${k}" class="${D.ctab===k?"on":""}">${l} (${counts[k]})</button>`).join("")}</div>
    <div id="mbody"></div>`;
  $("#cback").onclick = async()=>{ D.cclient = null; M.items = []; await loadDb().catch(()=>{}); renderDb(); };
  document.querySelectorAll("[data-ct]").forEach(b=>b.onclick=()=>{ D.ctab = b.dataset.ct; renderCleanClient(); });
  const w = $("#cwrite"); if (w) w.onclick = async()=>{
    if (!cl || !cl.map_machine){ toast("This client has no mapping computer yet (Clients tab → client → Mapping)."); return; }
    w.disabled = true;
    const r = await sb.from("map_jobs").insert({client_id:cl.id, machine:cl.map_machine, pass:"manual", requested_by:S.user.email,
      audit_date:null, detail:{kind:"apply", cleanup:true}}).select("id");
    if (r.error){ toast("Not started: "+r.error.message); w.disabled = false; return; }
    toast(`Sent to ${cl.map_machine}. This page updates as fixes are written.`);
    await refresh(true); renderCleanClient();
    const t0 = Date.now();
    const tick = setInterval(async()=>{ await refresh(true); if (D.cclient && S.view==="dbreview"){ await loadCleanItems().catch(()=>{}); renderCleanClient(); }
      if (!cleanJob(c.cid) || Date.now()-t0 > 30*60e3) clearInterval(tick); }, 15000);
  };
  if (D.ctab==="open"){
    $("#mbody").innerHTML = inTab.length ? `<div class="actions qlist">${inTab.map(libCard).join("")}</div>` : `<p class="muted">Nothing waiting.</p>`;
    wireClean();
  } else mapTable(inTab, "Nothing here.");
}
function wireClean(){
  document.querySelectorAll("#mbody .row[data-id]").forEach(row=>{
    const id = row.dataset.id, it = M.items.find(x=>x.id===id);
    const save = async (patch, msg)=>{
      const now = new Date().toISOString();
      row.querySelectorAll("button").forEach(x=>x.disabled=true);
      const r = await sb.from("mapping_items").update(Object.assign({decided_by:S.user.email, decided_at:now, updated_at:now}, patch)).eq("id",id).eq("status","open").select("id");

/* which clients have an audit on a given day: the schedule (cycle from the next / last audit date) */
function scheduledOn(c, day){
  if (!["active","onboarding"].includes((c.status||"").toLowerCase())) return false;
  if (c.last_pulled_date===day || c.next_due_date===day) return true;
  const cyc = cycleDays(c.audit_cycle, c.custom_cycle_days);
  if (!cyc) return false;
  const anchor = c.last_pulled_date && day < c.last_pulled_date ? c.last_pulled_date : c.next_due_date;
  if (!anchor) return false;
  const diff = daysBetween(day, anchor);
  return diff % cyc === 0 && Math.abs(diff) <= cyc*12;
}
function tally(rows){
  const t = {open:0, waiting:0, robot:0, done:0, failed:0};
  rows.forEach(r=>{ if (r.status==="open") t.open+=r.n; else if (r.status==="failed") t.failed+=r.n;
    else if (isWaiting(r)) t.waiting+=r.n; else if (r.status==="robot") t.robot+=r.n; else if (r.status==="applied") t.done+=r.n; });
  return t;
}
function dayCards(day){
  const cards = new Map();
  S.clients.filter(c=>scheduledOn(c,day)).forEach(c=>cards.set(ckey(c.id), {cid:c.id, venue:c.client_display_name, rows:[]}));
  M.sum.filter(r=>r.audit_date===day).forEach(r=>{
    const k = ckey(r.client_id, r.venue);
    if (!cards.has(k)) cards.set(k, {cid:r.client_id, venue:r.venue, rows:[]});
    cards.get(k).rows.push(r);
  });
  return [...cards.values()].map(x=>{ const c = x.cid && clientOf(x.cid);
      // a shared-login row shows each Pilot client under its own name, with its own computer and switch (11/24)
      return Object.assign(x, {name: c ? (PILOT_CLIENTS_OF[c.client_display_name] ? x.venue : c.client_display_name) : x.venue,
                               client: c && viewOf(c, x.venue), t:tally(x.rows)}); })
    .sort((a,b)=> (b.t.open+b.t.failed)-(a.t.open+a.t.failed) || a.name.localeCompare(b.name));
}

const unwrittenOn = day => (M.status||[]).some(r=>r.audit_date===day && ["waiting_pilot","running","failed"].includes(r.state));
/* Dave 11/24 ("word salad"): one card per audit, the same rows in the same places on every card.
   Name + machine; the headline count of what isn't mapped; progress; the last pass; the breakdown; one action. */
function dashCard(x, today){
  const t = x.t, c = x.client, un = unmappedOf(t), ran = x.rows.length>0;
  const cyc = c ? (CYCLES.find(y=>y[0]===c.audit_cycle)||[,""])[1] : "";
  const ms = c && mapState(c);
  const rows = (x.cid && M.status) ? M.status.filter(r=>r.client_id===x.cid && r.audit_date===M.day) : [];
  const P = k => rows.length>0 && rows.every(r=>((r.detail||{}).passes||{})[k]);
  const imported = rows.length>0 && rows.every(r=>r.imported_at);
  const step = (ok, label) => `<span class="${ok?"ok":"no"}">${ok?"✓":"○"} ${esc(label)}</span>`;
  const tm = ts => ts ? new Date(ts).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}) : "";
  const PN = {premap:"pre-map",main:"main map",after_count:"after-count map"};
  const jobs = x.cid ? S.jobs.filter(j=>j.client_id===x.cid && (j.audit_date===M.day || (!j.audit_date && (j.requested_at||"").slice(0,10)===M.day))) : [];
  const live = jobs.find(j=>["queued","running"].includes(j.status));
  const waitJob = jobs.find(j=>j.import_status==="waiting_click");
  // last pass: always one line, success or failure alike
  const run = rows.find(r=>r.state==="running"), wp = rows.find(r=>r.state==="waiting_pilot"), fl = rows.find(r=>r.state==="failed");
  const last = rows.slice().sort((a,b)=>String(b.finished_at||b.started_at).localeCompare(String(a.finished_at||a.started_at)))[0];
  const pass = run ? ["blue", `Running now: ${PN[run.pass]||run.pass}`]
    : live ? ["blue", live.status==="queued" ? `Queued: ${(live.detail||{}).kind==="apply"?"writing approved items":"map"}` : `Running now: ${(live.detail||{}).kind==="apply"?"writing approved items":"map"}`]
    : wp ? ["amber", `Not written yet · waiting to use Pilot on ${shortName(wp.machine)}`, wp.summary]
    : fl ? ["red", `Failed · ${PN[fl.pass]||fl.pass||"pass"} · ${tm(fl.finished_at||fl.started_at)}`, fl.summary]
    : last ? ["green", `Succeeded · ${PN[last.pass]||last.pass||"pass"} · ${tm(last.finished_at||last.started_at)}`, last.summary]
    : ["grey", M.day>today ? "Audit not done yet" : "No pass yet"];
  const sum = k => Math.min(t.open, rows.reduce((a,r)=>a+(r[k]||0),0));
  const row = (label, n, cls, sub) => `<span class="${sub?"sub":""}">${esc(label)}</span><span class="v ${n?cls:""}">${n||""}</span>`;
  // Dave 11/27: Hotel Gaythering showed "Everything's mapped" while its 36 decided lines had never reached Pilot - the
  // headline only counted open questions. A pass that decided but hasn't written (or failed) is NOT mapped.
  const unwritten = rows.find(r=>["waiting_pilot","running","failed"].includes(r.state));
  const head = un ? ["red", `${un} item${un===1?"":"s"} not mapped yet`]
    : unwritten ? [unwritten.state==="failed" ? "red" : "amber", unwritten.state==="running" ? "Mapping in progress" : "Decided, not written to Pilot yet"]
    : ran ? ["green", "✓ Everything's mapped"] : ["grey", M.day>today ? "Audit not done yet" : "Not mapped yet"];
  const canAfter = c && c.map_enabled && c.map_machine && P("main") && !P("after_count") && M.day<=today && !live && !run;
  const machine = ms && ms.cls==="green" ? `<span class="mach">${esc(c.map_machine.toUpperCase())}</span>` : "";
  return `<div class="ccard dash" role="button" tabindex="0" data-cc="${esc(x.cid||"")}" data-cv="${esc(x.venue)}">
    <div class="ch"><b>${esc(x.name)}</b>${machine}</div>
    <span class="small muted pos">${c?esc([POS_PREFIX[c.source_system]||"", cyc].filter(Boolean).join(" · ")):'<span class="tag red">Not linked to a client</span>'}${ms && ms.cls!=="green"?` · <span class="tag ${ms.cls}">${esc(ms.txt)}</span>`:""}</span>
    <div class="big ${head[0]}">${esc(head[1])}</div>
    <div class="sec">Progress</div>
    <div class="steps">${step(P("premap"),"Pre-map")}${step(P("main"),"Main map")}${step(imported,"Imported")}${step(P("after_count"),"After-count")}</div>
    <div class="sec">Last pass</div>
    <div class="pass ${pass[0]}" title="${esc(pass[2]||"")}">${esc(pass[1])}</div>
    <div class="sec">Not mapped yet</div>
    <div class="dgrid">
      ${row("Needs a person", t.open, "amber")}
      ${row("Question for the client", sum("waiting_client"), "amber", true)}
      ${row("Waiting on the count", sum("waiting_count"), "blue", true)}
      ${row("Pilot didn't take it", t.failed, "red")}
      ${row("Answered, waiting for the robot", t.waiting, "blue")}
    </div>
    <div class="sec">Mapped</div>
    <div class="dgrid">
      ${row("Mapped by the robot", t.robot, "green")}
      ${row("Done", t.done, "green")}
    </div>
    <div class="act">${waitJob?`<button class="b primary" data-imp="${esc(waitJob.id)}">Import now</button>`:""}${canAfter?`<button class="b" data-aftercount="${esc(x.cid)}" title="The robot never starts this on its own - only this button does">Count is in: run after-count map</button>`:""}</div>
  </div>`;
}
function renderMapping(){

      return `<button class="day ${d===M.day?"on":""} ${d===today?"today":""}" data-day="${d}">
        <span class="dn">${esc(fmtDay(d))}${d===today?" · today":""}</span>
        <span class="small muted">${cs.length} audit${cs.length===1?"":"s"}</span>
        ${un?`<span class="tag amber">${un} not mapped yet</span>`:uw?`<span class="tag amber">Not written to Pilot yet</span>`:ran?`<span class="tag green">All mapped</span>`:""}</button>`; }).join("")}</div>
    ${earlier.size?`<div class="banner amber"><b>Still open from earlier audits</b>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${[...earlier.values()].map(e=>{ const t = tally(e.rows), c = e.cid && clientOf(e.cid);
        return `<button class="b" data-ec="${esc(e.cid||"")}" data-ev="${esc(e.venue)}" data-ea="${esc(e.audit||"")}">${esc(c?c.client_display_name:e.venue)} · ${e.audit?esc(fmtDay(e.audit)):"no date"} · ${t.open+t.failed+t.waiting} open</button>`; }).join("")}</div></div>`:""}
    <h2 style="margin:18px 0 10px;font-size:18px">${esc(fmtLong(M.day))} <span class="muted small" style="font-weight:400">${cards.length} audit${cards.length===1?"":"s"}${(()=>{ const un = cards.reduce((a,x)=>a+unmappedOf(x.t),0); return un?` · <b style="color:var(--amber)">${un} item${un===1?"":"s"} not mapped yet</b>`:unwrittenOn(M.day)?' · <b style="color:var(--amber)">not written to Pilot yet</b>':cards.some(x=>x.rows.length)?' · <b style="color:var(--green)">everything mapped</b>':""; })()}</span></h2>
    <div class="ccards">${cards.map(x=>dashCard(x, today)).join("") || `<div class="muted">No audits on this day.</div>`}</div>
    </div><div id="mresults"></div>`;
  $("#wkp").onclick = ()=>moveWeek(-7); $("#wkn").onclick = ()=>moveWeek(7);
  $("#wkt").onclick = ()=>{ M.weekStart = mondayOf(todayISO()); M.day = todayISO(); reloadBoard(); };
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ M.day=b.dataset.day; renderMapping(); });
  document.querySelectorAll("[data-cc]").forEach(b=>{ const go = ()=>openClient(b.dataset.cc||null, b.dataset.cv, M.day);
    b.onclick = go; b.onkeydown = e=>{ if (e.target===b && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); go(); } }; });
  // Dave 11/24: no blind "Map now" on the board - the only run button is "the count is in", and it asks first
  document.querySelectorAll("[data-aftercount]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const c = clientOf(b.dataset.aftercount);
    if (!confirm(`Run the after-count map for ${c.client_display_name} now?\n\nThe robot on ${c.map_machine} writes the answers already given, maps against the count and imports the sales, then maps and books today's invoices. Open questions stay open.`)) return;
    mapNow(c, M.day, b, "after_count"); });
  document.querySelectorAll("[data-imp]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); releaseImport(S.jobs.find(j=>j.id===b.dataset.imp), b); });

function moveWeek(n){ M.weekStart = addDays(M.weekStart,n); M.day = addDays(M.day,n); reloadBoard(); }
async function reloadBoard(){ try{ await loadMapping(); }catch(e){ toast(e.message); } render(); }
async function openClient(cid, venue, audit){
  M.client = {cid, venue, audit}; M.other = null; M.q = "";
  try{ await loadClientItems(); }catch(e){ toast(e.message); }
  M.tab = M.items.some(i=>i.status==="open") ? "open" : M.items.some(i=>i.status==="failed") ? "robot" : M.items.some(i=>i.status==="decided"||i.choice==="wrong") ? "waiting" : "robot";
  render(); window.scrollTo(0,0);
}

async function searchAll(){
  const box = $("#mresults"), board = $("#mboard"); if (!box) return;
  const t = M.search.trim();
  if (!t){ box.innerHTML = ""; board.hidden = false; return; }
  board.hidden = true; box.innerHTML = `<div class="muted">Searching…</div>`;
  const s = t.replace(/[%,()]/g," ");
  const r = await sb.from("mapping_items").select(ITEM_COLS).or(`title.ilike.%${s}%,suggestion.ilike.%${s}%,venue.ilike.%${s}%,other_text.ilike.%${s}%`).order("audit_date",{ascending:false}).limit(300);
  if (r.error){ box.innerHTML = `<div class="msg err">${esc(r.error.message)}</div>`; return; }
  box.innerHTML = `<div class="tablewrap"><table><thead><tr><th>Client</th><th>Audit</th><th>POS button</th><th>Type</th><th>Suggestion / what was done</th><th>Status</th></tr></thead><tbody>
    ${r.data.map(i=>{ const c = i.client_id && clientOf(i.client_id);
      return `<tr data-sc="${esc(i.client_id||"")}" data-sv="${esc(i.venue)}" data-sa="${esc(i.audit_date||"")}"><td>${esc(c?c.client_display_name:i.venue)}</td><td class="mono small">${i.audit_date?fmtDate(i.audit_date):"—"}</td>
      <td><b>${esc(i.title)}</b></td><td>${kindTag(i.kind)}</td><td class="small" style="white-space:normal;max-width:340px">${esc(i.suggestion||"")}</td><td>${statusWord(i)}</td></tr>`; }).join("") || '<tr><td colspan="6" class="muted">Nothing found.</td></tr>'}
    </tbody></table></div><p class="muted small">Click a row to open that client's audit.</p>`;
  box.querySelectorAll("[data-sc]").forEach(tr=>tr.onclick=()=>{ M.search=""; openClient(tr.dataset.sc||null, tr.dataset.sv, tr.dataset.sa||null); });
}
function statusWord(i){
  if (i.choice==="wrong") return `<span class="tag red">Flagged wrong</span>`;
  return {open:'<span class="tag amber">Needs a person</span>', decided:'<span class="tag blue">Waiting for the robot</span>',
    robot:'<span class="tag green">Mapped by the robot</span>', applied:'<span class="tag">Done</span>', failed:'<span class="tag red">Failed</span>'}[i.status] || esc(i.status);
}

/* ---------- one client, one audit ---------- */
function renderClientAudit(){
  const c = M.client, cl = c.cid && viewOf(clientOf(c.cid), c.venue), name = cl ? (cl._pilot || cl.client_display_name) : c.venue;
  const it = M.items;
  const open = it.filter(i=>i.status==="open");
  const waiting = it.filter(i=>i.status==="decided" || (i.choice==="wrong" && i.status!=="open"));
  const robot = it.filter(i=>(i.status==="robot"||i.status==="failed") && i.choice!=="wrong");
  const done = it.filter(i=>i.status==="applied" && i.choice!=="wrong");
  const audits = [...new Set([...(c.audit && c.audit!=="all"?[c.audit]:[]), ...M.audits])].sort().reverse();
  // Dave 11/18: client questions get their OWN place, all together - not buried in the answered list
  const cq = (M.notes||[]).filter(n=>n.status!=="dropped" && n.kind==="question").length;
  const tabs = [["open","Needs a person",open.length],["client","Questions for the client",cq],["waiting","Waiting for the robot",waiting.length],["robot","Mapped by the robot",robot.length],["done","Done",done.length]];
  // Dave 11/24: "I mapped these myself" works in every situation - open questions AND answers not written yet
  const unwritten = it.filter(i=>["open","decided","failed"].includes(i.status));
  const busy = cl && c.audit && c.audit!=="all" && writeJob(cl, c.audit);
  $("#main").innerHTML = `
    <div class="chead">
      <div class="row1">
        <button class="b" id="mback">‹ ${esc(fmtShort(M.day))}</button>
        <h2>${esc(name)}</h2>
        ${cl?"":'<span class="tag red">Not linked to a client</span>'}
        <span class="grow" style="flex:1"></span>
        <select id="maudit" style="max-width:220px" aria-label="Audit">${audits.map(a=>`<option value="${a}" ${a===c.audit?"selected":""}>Audit ${esc(fmtShort(a))}</option>`).join("")}
          ${c.audit===null?'<option value="" selected>No audit date</option>':""}<option value="all" ${c.audit==="all"?"selected":""}>All audits</option></select>
      </div>
      ${openBanner(open.length, waiting.length, acceptBar(cl, c, open, busy) + writeNowBar(cl, c, it) + (unwritten.length && !busy ? `<button class="b" id="mclear" title="Use this when you've mapped or trashed them yourself in Pilot. They move to Done as 'done by hand in Pilot' and the robot won't write them.">I mapped these in Pilot myself</button>` : ""))}
      <div class="tabs">${tabs.map(([k,l,n])=>`<button data-mt="${k}" class="${M.tab===k?"on":""}">${l} (${n})${k==="open"&&n?' <span class="tag red">'+n+'</span>':""}</button>`).join("")}</div>
    </div>
    ${cl?"":`<div class="msg info">These items came from a Pilot venue name that doesn't match a client in the Clients tab. They still work; Claude links them on the next run.</div>`}
    ${lastWriteLine(cl, c)}
    <div id="mbody"></div>
    ${c.cid && c.audit && c.audit!=="all" && statusLine(c.cid, c.audit, true) ? `<div class="card" style="margin:14px 0">${statusLine(c.cid, c.audit, true)}</div>` : ""}`;
  $("#mshow")?.addEventListener("click", ()=>{ M.tab="open"; M.other=null; renderClientAudit(); $("#mbody")?.scrollIntoView({behavior:"smooth"}); });
  $("#mback").onclick = ()=>{ M.client=null; M.items=[]; render(); };
  $("#mwrite")?.addEventListener("click", e=>{
    const n = Number(e.currentTarget.dataset.n), nOpen = open.length, mc = cl.map_machine||"the mapping computer";
    const msg = (nOpen ? `${nOpen} question${nOpen>1?"s are":" is"} still open. ${nOpen>1?"They stay":"It stays"} unmapped in Pilot until someone answers.\n\nWrite the ${n} approved item${n>1?"s":""} now anyway?`
                       : `Write ${n} approved item${n>1?"s":""} into Pilot now?`)
      + `\n\nPilot on ${mc} is in use while it writes (about a minute, plus 15 seconds per item). Make sure nobody is in the middle of something in Pilot on that computer.`;
    if (confirm(msg)) writeNow(cl, c, e.currentTarget); });
  $("#macc")?.addEventListener("click", e=>acceptRobot(cl, c, open, false, e.currentTarget));
  $("#maccw")?.addEventListener("click", e=>acceptRobot(cl, c, open, true, e.currentTarget));
  $("#mclear")?.addEventListener("click", async e=>{
    const n = k => unwritten.filter(i=>i.status===k).length, parts = [];
    if (n("open")) parts.push(`${n("open")} open question${n("open")>1?"s":""}`);
    if (n("decided")) parts.push(`${n("decided")} answer${n("decided")>1?"s":""} not written yet`);
    if (n("failed")) parts.push(`${n("failed")} Pilot didn't take`);
    if (!confirm(`Clear ${unwritten.length} item${unwritten.length>1?"s":""} that the robot hasn't put in Pilot (${parts.join(", ")})?\n\nUse this when you've mapped or trashed them yourself in Pilot. They move to Done as "done by hand in Pilot" and the robot won't write them. It learns your answers from Pilot itself on its next run.`)) return;
    const btn = e.currentTarget; btn.disabled = true;
    const now = new Date().toISOString(), ids = unwritten.map(i=>i.id); let done = 0;
    for (let k=0; k<ids.length; k+=100){
      const r = await sb.from("mapping_items").update({status:"applied", applied_at:now, applied_detail:"done by hand in Pilot",
        decided_by:S.user.email, decided_at:now, updated_at:now}).in("id", ids.slice(k,k+100)).in("status",["open","decided","failed"]).select("id");
      if (r.error){ toast("Stopped: "+r.error.message); break; }
      done += r.data.length;
    }
    toast(`Cleared ${done} item${done===1?"":"s"}.`);
    await refresh(true);
    if (M.client) { await loadClientItems().catch(()=>{}); renderClientAudit(); }
  });
  $("#maudit").onchange = async e=>{ M.client.audit = e.target.value===""?null:e.target.value; try{ await loadClientItems(); }catch(er){ toast(er.message); } renderClientAudit(); };
  document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{ M.tab=b.dataset.mt; M.other=null; renderClientAudit(); });
  if (M.tab==="open") mapOpen(open);
  else if (M.tab==="client"){ $("#mbody").innerHTML = notesPanel(true); wireNotes(); }
  else if (M.tab==="waiting") mapTable(waiting, "Nothing waiting. Decisions show here until the robot's next run carries them out.");
  else if (M.tab==="robot") mapTable(robot, "The robot hasn't mapped anything on its own for this audit.", true);
  else mapTable(done, "Nothing finished yet for this audit.");
}

/* Dave 11/18 (The Corner): the page "is showing a state of completion; however, the process is not even 1/2 done".
   Open questions are the FIRST thing on the page, every time, in red - never below the client notes. */
function openBanner(nOpen, nWaiting, buttons){
  const end = `<span class="grow"></span>${buttons||""}`;
  if (nOpen) return `<div class="banner red">
      <b>${nOpen} question${nOpen>1?"s":""} still need${nOpen>1?"":"s"} you — this audit is NOT done.</b>
      ${M.tab!=="open"?`<button class="b sm" id="mshow">Show them</button>`:""}${end}</div>`;
  if (nWaiting) return `<div class="banner amber"><b>Every question is answered.</b> <span>${nWaiting} answer${nWaiting>1?"s are":" is"} waiting to be written into Pilot.</span>${end}</div>`;
  return `<div class="banner green"><b>Nothing open for this audit.</b>${end}</div>`;
}

/* "Write to Pilot now": approved items are written into Pilot by the client's mapping computer
   within a minute, instead of waiting for a run (Dave 11/12: waiting "leaves the audit incomplete"). */
function writeJob(cl, audit){
  return S.jobs.find(j=>cl && j.client_id===cl.id && j.pass==="manual" && (j.detail||{}).kind==="apply"
    && j.audit_date===audit && ["queued","running"].includes(j.status));
}
/* Dave 11/24: just the button in the frozen bar; the explanation is the confirm that follows the click
   (Dave 11/18: it still checks for open questions before it writes) */
function writeNowBar(cl, c, it){
  if (!cl || !c.audit || c.audit==="all") return "";
  const job = writeJob(cl, c.audit);
  if (job) return `<span class="tag blue">${job.status==="queued"?`Writing to Pilot: waiting for ${esc(shortName(job.machine||""))} to pick it up`:`Writing to Pilot on ${esc(shortName(job.machine||""))} now`}</span>`;
  const n = it.filter(i=>i.status==="decided" && !["reject","wait_count","created"].includes(i.choice)).length;
  if (!n) return "";
  return `<button class="b primary" id="mwrite" data-n="${n}" title="Writes the approved answers into Pilot on ${esc(cl.map_machine||"the mapping computer")} now, instead of waiting for the next pass">Write ${n} approved to Pilot</button>`;
}
/* Dave 11/25: when the robot DECIDED a line but couldn't get into Pilot (an AVG window covered it all night), those cards
   never needed him. Two buttons accept every one of them at once - the robot's own answer, nothing else. Real
   questions (not sure, not set up, client recipe) are never touched. */
const ROBOT_DECIDED = /^Problem: Decided, (but Pilot didn't take it|not entered in Pilot yet)/;
const ROBOT_ACTIONS = ["MAP", "TRASH", "BUILD_AND_MAP"];
function robotAnswered(open){
  return open.filter(i=>ROBOT_DECIDED.test(i.reason||"") && ROBOT_ACTIONS.includes(((i.options||[])[0]||{}).action));
}
function acceptBar(cl, c, open, busy){
  const n = robotAnswered(open).length;
  if (!n || busy) return "";
  return `<button class="b" id="macc" title="Approves the robot's own answer on every card it decided but couldn't enter in Pilot. Real questions stay open.">Accept the robot's ${n} answer${n>1?"s":""}</button>`
    + (cl && c.audit && c.audit!=="all" ? `<button class="b primary" id="maccw" title="Same, then writes them into Pilot on ${esc(cl.map_machine||"the mapping computer")} now">Accept ${n} and write to Pilot now</button>` : "");
}
async function acceptRobot(cl, c, open, writeAfter, btn){
  const items = robotAnswered(open), n = items.length;
  if (!n) return;
  const mc = (cl && cl.map_machine) || "the mapping computer";
  const msg = `Accept the robot's answer on ${n} card${n>1?"s":""} it decided but couldn't enter in Pilot?\n\nOnly those cards. Questions that need a person stay open.`
    + (writeAfter ? `\n\nThen write them into Pilot on ${mc} now. Pilot on that computer is in use while it writes (about a minute, plus 15 seconds per item). Make sure nobody is in the middle of something in Pilot there.`
                  : `\n\nThey go into Pilot on the robot's next pass, or when you press "Write approved to Pilot".`);
  if (!confirm(msg)) return;
  if (writeAfter && !(cl && cl.map_machine)){ toast("This client has no mapping computer yet (Clients tab → client → Mapping)."); return; }
  btn.disabled = true;
  const now = new Date().toISOString(); let ok = 0;
  for (const i of items){
    const o = i.options[0];
    const r = await sb.from("mapping_items").update({status:"decided", choice:"approve", chosen:o, suggestion:o.label,
      target:o.target||null, target_type:o.type||null, delta_oz:o.pour_oz??null, decided_by:S.user.email, decided_at:now, updated_at:now})
      .eq("id", i.id).eq("status","open").select("id");
    if (r.error){ toast("Stopped: "+r.error.message); break; }
    ok += r.data.length;
  }
  toast(`Accepted ${ok} of the robot's answers.`);
  await refresh(true);
  if (M.client) { await loadClientItems().catch(()=>{}); renderClientAudit(); }
  if (writeAfter && ok) writeNow(cl, c, $("#mwrite") || btn);
}
function lastWriteLine(cl, c){

  const last = S.jobs.filter(j=>j.client_id===cl.id && (j.detail||{}).kind==="apply" && j.audit_date===c.audit && ["done","failed"].includes(j.status))

  return last ? `<p class="muted small" style="margin:0 0 10px">Last write to Pilot: ${esc(fmtTime(last.finished_at))} — ${esc(last.summary||last.status)}</p>` : "";

async function writeNow(cl, c, btn){

function mapOpen(items){
  const byKind = {}; items.forEach(i=>(byKind[i.kind] ||= []).push(i));
  const kinds = [...KIND_ORDER.filter(k=>byKind[k]), ...Object.keys(byKind).filter(k=>!KIND_ORDER.includes(k))];
  /* Dave 11/17: "Once you are behind, I have to take over" - the "I mapped these in Pilot myself" button in the frozen
     bar clears everything not yet in Pilot (Dave 11/24: open AND answered-but-unwritten), so the robot never writes them twice */
  $("#mbody").innerHTML = items.length ? `<p class="muted small" style="margin-top:0">Pick the right button. When you're done, press "Write approved to Pilot" above. "Leave it unmapped" stops it being asked again.</p>
    ${kinds.map(k=>`<h3 style="margin:18px 0 8px;font-size:15px">${esc(KIND_HEAD[k]||KIND[k]||k)} <span class="muted small">${byKind[k].length}</span></h3>
      <div class="actions qlist">${byKind[k].map(cardHTML).join("")}</div>`).join("")}`
    : `<div class="center" style="min-height:30vh"><b>Nothing needs a person for this audit.</b><span class="muted">New items appear here after each mapping run.</span></div>`;
  wireCards();
}
/* MOD vs menu item (Dave 11/12): a modifier rides on an item that already pours and is mapped
   differently, so every card says which it is. The robot puts it at the start of the reason. */
function lineTag(reason){
  const m = /^(Modifier|Menu item) — /.exec(reason||"");
  if (!m) return ["", reason||""];
  const mod = m[1]==="Modifier";
  return [`<span class="tag ${mod?"amber":"blue"}" title="${mod?"A choice added to a menu item that already pours":"A menu item rung in on its own"}">${mod?"MODIFIER":"MENU ITEM"}</span> `, (reason||"").slice(m[0].length)];
}

    ${askBox(i)}

      <div style="margin-top:8px;display:flex;gap:8px"><button class="b primary" data-a="other-save">Save</button><button class="b" data-a="other-cancel">Cancel</button></div></div>`:""}

        :i.kind==="trash"?`<button class="b primary" data-a="approve">Trash it</button><button class="b" data-a="reject">Don't trash</button><button class="b" data-a="other">Something else</button>`

function wireCards(){
  document.querySelectorAll("#mbody .row[data-id]").forEach(row=>{
    const id = row.dataset.id;
    // library cards (Dave 11/20): each button does exactly what it says
    row.querySelectorAll("[data-lib]").forEach(b=>b.onclick=async()=>{
      const it = M.items.find(x=>x.id===id), o = (it.options||[])[+b.dataset.lib];
      if (o.action==="ASK_CLIENT"){ M.ask=id; M.other=null; renderClientAudit(); $("#aq")?.focus(); return; }
      if (o.action==="WRITE_IN" && !o.text){ M.other=id; M.ask=null; renderClientAudit(); $("#ot")?.focus(); return; }
      const now = new Date().toISOString();
      const base = {status:"decided", decided_by:S.user.email, decided_at:now, updated_at:now, chosen:o, suggestion:o.label};
      const patch = o.action==="WAIT_COUNT" ? {...base, choice:"wait_count"}
        : o.action==="CREATED" ? {...base, choice:"created"}
        : (o.action==="KEEP" || o.action==="LEAVE") ? {...base, choice:"reject"}   // LEAVE: Dave 11/24, every sales card
        : o.action==="WRITE_IN" ? {...base, choice:"other", other_text:o.text}
        : {...base, choice:"approve", target:o.target||null, target_type:o.type||null, delta_oz:o.pour_oz??null};
      row.querySelectorAll("button").forEach(x=>x.disabled=true);
      const r = await sb.from("mapping_items").update(patch).eq("id",id).eq("status","open").select("id");
      if (r.error){ toast("Not saved: "+r.error.message); row.querySelectorAll("button").forEach(x=>x.disabled=false); return; }
      if (!r.data?.length) toast("Someone already decided this one.");
      else toast(o.action==="WAIT_COUNT" ? "Parked until the count. The after-count pass maps it."
        : o.action==="CREATED" ? "Got it. The next pass maps it to the product you set up."
        : o.action==="KEEP" ? "Kept as it is. The robot won't ask about it again."
        : o.action==="LEAVE" ? "Left unmapped. The robot won't ask about it again."
        : o.action==="WRITE_IN" ? "Saved. Claude reads it on the next pass." : `Chosen: ${o.label}. The next pass writes it (or press "Write approved to Pilot").`);
      Object.assign(it, patch); loadMapping().catch(()=>{}).then(render);
    });
    row.querySelectorAll("[data-opt]").forEach(b=>b.onclick=async()=>{
      const it = M.items.find(x=>x.id===id), o = (it.options||[])[+b.dataset.opt];
      const now = new Date().toISOString();
      const patch = {status:"decided", choice:"approve", chosen:o, suggestion:o.label, target:o.target||null,
        target_type:o.type||null, delta_oz:o.pour_oz??null, decided_by:S.user.email, decided_at:now, updated_at:now};
      row.querySelectorAll("button").forEach(x=>x.disabled=true);
      const r = await sb.from("mapping_items").update(patch).eq("id",id).eq("status","open").select("id");
      if (r.error){ toast("Not saved: "+r.error.message); row.querySelectorAll("button").forEach(x=>x.disabled=false); return; }
      if (!r.data?.length) toast("Someone already decided this one.");
      else toast(`Chosen: ${o.label}. Press "Write approved to Pilot" when you're ready.`);
      Object.assign(it, patch); loadMapping().catch(()=>{}).then(render);
    });
    row.querySelectorAll("[data-a]").forEach(b=>b.onclick=async(e)=>{
      e.preventDefault();
      const a = b.dataset.a;
      if (a==="other"){ M.other=id; M.ask=null; renderClientAudit(); $("#ot")?.focus(); return; }
      if (a==="other-cancel"){ M.other=null; renderClientAudit(); return; }
      if (a==="ask"){ M.ask=id; M.other=null; renderClientAudit(); $("#aq")?.focus(); return; }
      if (a==="ask-cancel"){ M.ask=null; renderClientAudit(); return; }
      if (a==="ask-save"){
        const t = ($("#aq").value||"").trim(); if (!t){ toast("Write the question first."); return; }
        const it = M.items.find(x=>x.id===id); b.disabled = true;
        if (!await saveNote("question", t, it, id)){ b.disabled = false; return; }
        const now = new Date().toISOString();
        const patch = {status:"applied", choice:"ask_client", decided_by:S.user.email, decided_at:now,
          applied_at:now, applied_detail:"On the client question list: "+t, updated_at:now};
        const r = await sb.from("mapping_items").update(patch).eq("id",id).eq("status","open").select("id");
        if (r.error) toast("Question saved, but the item didn't move: "+r.error.message);
        else toast('Added. Every question for this client is on the "Questions for the client" tab.');
        M.ask=null; if (it) Object.assign(it, patch);   // notes stay closed: they must never push open questions down
        loadMapping().catch(()=>{}).then(render);
        return;
      }
      const now = new Date().toISOString();
      let patch = {status:"decided", choice:a, decided_by:S.user.email, decided_at:now, updated_at:now};
      if (a==="other-save"){ const t = ($("#ot").value||"").trim(); if (!t){ toast("Write what it should be first."); return; } patch.choice="other"; patch.other_text=t; }
      b.disabled = true;
      const r = await sb.from("mapping_items").update(patch).eq("id",id).eq("status","open").select("id");
      if (r.error){ toast("Not saved: "+r.error.message); b.disabled=false; return; }
      if (!r.data?.length) toast("Someone already decided this one.");
      else toast({approve:`Approved. Press "Write approved to Pilot" when you're ready.`,reject:"Left unmapped — it won't be suggested again.",noted:"Noted.","other-save":"Saved. A written answer needs Claude to read it before it can go into Pilot."}[a]);
      M.other=null; const it = M.items.find(x=>x.id===id); if (it) Object.assign(it, patch);
      loadMapping().catch(()=>{}).then(render);
    });
  });
}

// Dave 11/19: the Type column says WHERE the line came from - Invoice, PMIX Mapping (menu item) or MOD Mapping
// (modifier) - never "Mapped" (the result column already says mapped or trashed). The source tag the robot writes at
// the front of the reason ("Modifier — ...", "Menu item, $9.00 a sale — ...") moves here; "auto:" is dropped.
function lineType(i){
  const r = i.reason||"";
  if (isLib(r)){                                   // Dave 11/20 bullet cards: "Line: Menu item, $9.00 a sale · ..."
    const b = libBullets(r), line = (b.find(x=>LINE_LABELS.includes(x[0]))||[,""])[1];
    const lm = line.match(/^(Modifier|Menu item)(, \$[\d,.]+ a sale)?/);
    const src = i.kind==="invoice" ? "Invoice" : lm ? (lm[1]==="Modifier" ? "MOD Mapping" : "PMIX Mapping") : "Mapping (source unknown)";
    return {src, price: lm && lm[2] ? lm[2].slice(2) : "", why: b.filter(x=>!LINE_LABELS.includes(x[0])).map(x=>x[0]+": "+x[1].replace(/\*\*/g,"")).join(" · ")};
  }
  const m = r.match(/^(Modifier|Menu item)(, \$[\d,.]+ a sale)? — /);
  const src = i.kind==="invoice" ? "Invoice" : m ? (m[1]==="Modifier" ? "MOD Mapping" : "PMIX Mapping") : "Mapping (source unknown)";
  const why = (m ? r.slice(m[0].length) : r).replace(/^auto:\s*/, "").replace(/^Claude:\s*/, "");
  return {src, price: m && m[2] ? m[2].slice(2) : "", why};
}
const typeTag = t => `<span class="tag ${t.src==="MOD Mapping"?"amber":t.src==="PMIX Mapping"?"blue":t.src==="Invoice"?"":"red"}">${esc(t.src)}</span>${t.price?`<div class="muted small">${esc(t.price)}</div>`:""}`;
function mapTable(list, empty, canFlag){

function flagWrong(i){
